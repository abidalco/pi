<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppet Playground</title>
<style>
  :root { --bg: #0d0b14; --panel: #17131f; --line: #2a2338; --btn: #2a2340; --btn2: #3b3158; --ink: #eee9f6; --dim: #a99cc4; --key: #ffb86b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; padding: 12px; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; }
  #panel { width: 300px; padding: 12px 14px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 4px; } p { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
  h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  button { background: var(--btn); color: var(--ink); border: 1px solid var(--btn2); border-radius: 6px; padding: 5px 8px; margin: 0 4px 4px 0; cursor: pointer; font: 12px system-ui; }
  button:hover { background: var(--btn2); } button.wide { width: 100%; }
  kbd { color: var(--key); font: 11px ui-monospace, monospace; margin-left: 4px; }
  label { display: block; margin: 6px 0 2px; font-size: 12px; color: var(--dim); }
  input[type=range], select { width: 100%; }
  select { background: var(--btn); color: var(--ink); border: 1px solid var(--btn2); border-radius: 6px; padding: 4px; }
  #log { font: 11px ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; max-height: 150px; overflow: auto; background: #0f0c16; padding: 6px; border-radius: 6px; }
  textarea { width: 100%; height: 120px; background: #0f0c16; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: 11px ui-monospace, monospace; display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="panel">
  <h1>Puppet Playground</h1>
  <p>Drive SORA live. Click the picture first so the keyboard works.</p>
  <h3>Move</h3>
  <div><button data-k="walkL">◀ walk<kbd>←</kbd></button><button data-k="walkR">walk ▶<kbd>→</kbd></button></div>
  <p>Hold the arrow keys to walk; add <kbd>Shift</kbd> to run. Release to stop.</p>
  <h3>Actions</h3>
  <div id="acts"></div>
  <h3>Face</h3>
  <div id="faces"></div>
  <h3>Look (1.5 s glance)</h3>
  <div id="looks"></div>
  <h3>Scene</h3>
  <label>Character</label>
  <select id="char"><option value="sora">SORA (drawn in code)</option><option value="cap">cap (fal image parts)</option></select>
  <label>Location</label>
  <select id="set"><option>rooftop</option><option>embankment</option><option>sky_close</option></select>
  <label>Zoom <span id="zv"></span></label><input id="zoom" type="range" min="2.5" max="14" step=".1" value="4.5">
  <label>Floor height <span id="fv"></span></label><input id="floor" type="range" min="650" max="1200" step="5" value="930">
  <label>Camera lead <span id="lv"></span></label><input id="lead" type="range" min="-120" max="120" step="2" value="30">
  <h3>Take</h3>
  <button id="reset">Reset<kbd>R</kbd></button><button id="copy">Copy as film.js</button>
  <textarea id="out" readonly></textarea>
  <h3>Log</h3>
  <div id="log"></div>
</div>
<script src="util.js"></script>
<script src="rig.js"></script>
<script src="poses.js"></script>
<script src="world.js"></script>
<script src="fx.js"></script>
<script src="sets.js"></script>
<script src="actions.js"></script>
<script src="timeline.js"></script>
<script>
ctx = document.getElementById('c').getContext('2d');
const $ = id => document.getElementById(id);
const S = { set: 'rooftop', zoom: 4.5, floorY: 930, lead: 30, events: [], t0: performance.now() };
const now = () => (performance.now() - S.t0) / 1000;
const LONG = 600;                 // "until something else happens" (10 min)
let shot;

// one-shot actions hand back to something sensible when they finish
const THEN = {
  front_flip: [[.88, { do: 'idle', dur: LONG }]], hop: [[.6, { do: 'idle', dur: LONG }]],
  wave: [[1.2, { do: 'idle', dur: LONG }]], point: [[1, { do: 'idle', dur: LONG }]], talk: [[1.5, { do: 'idle', dur: LONG }]],
  stop: [[.25, { do: 'idle', dur: LONG }]], wobble: [[.5, { do: 'idle', dur: LONG }]],
  dive_land: [[.75, { do: 'rise' }], [1.37, { do: 'idle', dur: LONG }]],
  sit_down: [[.48, { do: 'sit_pant', dur: LONG }]],
  pose: [[.5, { do: 'idle', dur: LONG }]],
};
const ACTS = [
  ['flip', { do: 'front_flip' }, 'Space'], ['hop', { do: 'hop', dist: 20 }, '↑'], ['wave', { do: 'wave' }, 'W'], ['point', { do: 'point' }, 'P'],
  ['talk', { do: 'talk' }, 'T'], ['launch up', { do: 'launch', dur: LONG }, 'L'], ['dive + land', { do: 'dive_land' }, 'D'],
  ['wobble', { do: 'wobble' }, 'O'], ['sit (exhausted)', { do: 'sit_down' }, 'S'], ['stand up', { do: 'pose', to: 'stand', dur: .5 }, 'U'], ['idle', { do: 'idle', dur: LONG }, 'I'],
];
const KEYS = { ' ': 0, ArrowUp: 1, w: 2, p: 3, t: 4, l: 5, d: 6, o: 7, s: 8, u: 9, i: 10 };

function rebuild() {
  const seq = sequence(S.events, { x: 0, dir: 1, pose: 'stand' });
  shot = { id: 'live', set: S.set, t0: 0, dur: LONG, text: [], x0: 0,
    camera: { zoom: S.zoom, floorY: S.floorY, follow: { k: 1, lead: S.lead } },
    perf: tt => seq.perf(tt) };
  shot.perf.segAt = tt => seq.perf.segAt(tt);
  shot.cues = seq.cues.map(q => ({ ...q, x: seq.perf(q.t).x }));
}
function log(s) { const el = $('log'); el.textContent = `${now().toFixed(2)}s  ${s}\n` + el.textContent; }
function act(ev, label) {
  const t = now();
  S.events = S.events.filter(e => e.at <= t || !e.do);     // a new action replaces anything queued after it
  S.events.push({ at: t, ...ev });
  for (const [dt, nx] of THEN[ev.do] || []) S.events.push({ at: t + dt, ...nx });
  rebuild(); log(label || ev.do);
}
function overlay(ev, label) { S.events.push({ at: now(), ...ev }); rebuild(); log(label); }
function reset() { S.t0 = performance.now(); S.events = [{ at: 0, do: 'idle', dur: LONG }]; rebuild(); $('log').textContent = ''; $('out').style.display = 'none'; }

// controls
ACTS.forEach(([name, ev, key]) => {
  const b = document.createElement('button'); b.innerHTML = `${name}<kbd>${key}</kbd>`; b.onclick = () => act(ev, name); $('acts').appendChild(b);
});
['neutral', 'determined', 'smirk', 'smile', 'happy', 'tired', 'surprised', 'blink', 'glint'].forEach(f => {
  const b = document.createElement('button'); b.textContent = f;
  b.onclick = () => overlay({ face: f, dur: f === 'blink' ? .08 : f === 'glint' ? .25 : undefined }, 'face: ' + f); $('faces').appendChild(b);
});
['up', 'down', 'back', 'sky'].forEach(l => {
  const b = document.createElement('button'); b.textContent = l; b.onclick = () => overlay({ look: l, dur: 1.5 }, 'look: ' + l); $('looks').appendChild(b);
});
let walking = 0, running = false;
function walk(dir, run) {
  if (walking === dir && running === run) return;
  walking = dir; running = run;
  act({ do: run ? 'run' : 'walk', dur: LONG, dir }, `${run ? 'run' : 'walk'} ${dir > 0 ? '▶' : '◀'}`);
}
function halt() { if (!walking) return; walking = 0; act({ do: 'stop' }, 'stop'); }
document.querySelectorAll('[data-k]').forEach(b => {
  const dir = b.dataset.k === 'walkL' ? -1 : 1;
  b.onpointerdown = () => walk(dir, false); b.onpointerup = b.onpointerleave = halt;
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); walk(e.key === 'ArrowLeft' ? -1 : 1, e.shiftKey); return; }
  if (e.key === 'Shift' && walking) { walk(walking, true); return; }
  if (e.repeat) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'r') return reset();
  if (k in KEYS) { e.preventDefault(); const [name, ev] = ACTS[KEYS[k]]; act(ev, name); }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') halt();
  if (e.key === 'Shift' && walking) walk(walking, false);
});
const bind = (id, key, out, fmt = v => v) => { const el = $(id); const upd = () => { S[key] = +el.value; $(out).textContent = fmt(el.value); rebuild(); }; el.oninput = upd; upd(); };
bind('zoom', 'zoom', 'zv'); bind('floor', 'floorY', 'fv', v => v + 'px'); bind('lead', 'lead', 'lv');
$('set').onchange = e => { S.set = e.target.value; rebuild(); log('location: ' + S.set); };
$('char').onchange = e => useCharacter(e.target.value).then(() => { rebuild(); log('character: ' + e.target.value); });
$('reset').onclick = reset;
$('copy').onclick = () => {
  const end = +now().toFixed(2);
  const hero = S.events.filter(e => e.at <= end).map(e => {
    const o = { ...e, at: +e.at.toFixed(2) };
    if (o.dur >= LONG) delete o.dur;
    if (o.dur === undefined && (o.do === 'walk' || o.do === 'run' || o.do === 'idle' || o.do === 'sit_pant' || o.do === 'launch')) o.dur = +(end - o.at).toFixed(2);
    return o;
  });
  const txt = `FILM({\n  fps: 24, character: '${$('char').value}',\n  shots: [\n    { id: 'take', dur: ${end}, set: '${S.set}', start: { x: 0, dir: 1, pose: 'stand' },\n` +
    `      camera: { zoom: ${S.zoom}, floorY: ${S.floorY}, follow: { k: 1, lead: ${S.lead} } },\n` +
    `      hero: [\n${hero.map(h => '        ' + JSON.stringify(h)).join(',\n')},\n      ] },\n  ],\n});\n`;
  $('out').value = txt; $('out').style.display = 'block';
  navigator.clipboard?.writeText(txt).then(() => log('copied film.js'), () => log('select the text below to copy'));
};

reset();
(function frame() {
  const t = now();
  try {
    drawSideShot(shot, t);
    ctx.setTransform(1, 0, 0, 1, 0, 0); bloom(ctx, .22); grade(ctx, Math.round(t * 24));
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
})();
window.PLAY = { act, now, S };            // for scripted testing
</script>
</body>
</html>
