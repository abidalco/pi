    flat: '<rect class="wall" width="320" height="130"/><path class="fl" d="M0 130H320V180H0Z"/><rect class="win" x="26" y="30" width="70" height="62"/><path class="ln" d="M61 30v62M26 61h70"/><rect class="m" x="0" y="100" width="100" height="30"/><path class="ln" d="M176 0v42"/><circle class="lamp" cx="176" cy="48" r="7"/><rect class="m2" x="122" y="104" width="112" height="8" rx="2"/><path class="ln" d="M132 112v34M224 112v34"/><rect class="dk" x="262" y="40" width="40" height="90"/><circle class="lamp" cx="270" cy="88" r="2"/>',
    bridge: '<rect class="bg" width="320" height="180"/><path class="ln" d="M244 30v62M226 34h44M244 34l-14 12M70 40v52M56 44h40M70 44l-10 9" style="opacity:.35"/><path class="fl" d="M0 180L130 98H190L320 180Z"/><path class="ln" d="M160 100v10M160 122v14M160 150v22" style="stroke:#f1efe9;stroke-width:2"/><path class="ln" d="M0 118L130 94M320 118L190 94"/><path class="ln" d="M40 112V70M100 99V76M220 99V76M280 112V70"/><circle class="lamp" cx="40" cy="68" r="5"/><circle class="lamp" cx="100" cy="74" r="4"/><circle class="lamp" cx="220" cy="74" r="4"/><circle class="lamp" cx="280" cy="68" r="5"/><rect class="m" x="190" y="112" width="58" height="34" rx="4"/><rect class="dk" x="196" y="118" width="46" height="10" rx="1"/>',
    alleys: '<rect class="bg" width="320" height="180"/><path class="wall" d="M0 0H110L140 120V180H0Z"/><path class="wall2" d="M320 0H210L180 120V180H320Z"/><path class="fl" d="M140 120H180L320 180H0Z"/><path class="ln" d="M18 30h60M18 70h66M18 110h72M24 30l50 40M24 70l56 40M18 30v80M78 30l6 80"/><rect class="dk" x="230" y="66" width="30" height="64"/>',
    fish: '<rect class="bg" width="320" height="180"/><path class="fl" d="M0 120H320V180H0Z"/>' + [0, 1, 2, 3].map((i) => `<g transform="translate(${16 + i * 76} 0)"><path class="aw" d="M0 60h64v14q-8 8-16 0q-8 8-16 0q-8 8-16 0q-8 8-16 0z"/><rect class="aw2" x="6" y="96" width="52" height="24"/><path class="ln" d="M6 74v46M58 74v46"/></g>`).join(''),
  };
  function placeArt(r, slot, opt) {
    const mirror = opt % 2 === 1, low = opt >= 2;
    let vb = '0 0 320 180';
    if (slot.includes(':')) {
      const [k, id] = slot.split(':');
      const a = (k === 'area' ? r.areas : r.elements || []).find((x) => x.id === id);
      if (a) { let [x, y, w, h] = a.crop; if (mirror) x = 320 - x - w; vb = `${x} ${y} ${w} ${h}`; }
    }
    const t = `${mirror ? 'translate(320 0) scale(-1 1)' : ''}${low ? ' translate(0 6)' : ''}`;
    return svg(vb, `<rect class="bg" width="320" height="180"/><g transform="${t}">${PLACES[r.place] || ''}</g>`);
  }
  function art(r, slot, opt = 0, v = null) {
    if (r.kind === 'character') {
      if (slot.startsWith('expr:')) return face(r, slot.slice(5), v);
      if (slot.startsWith('outfit:')) return figure(r, r.outfits.find((o) => o.id === slot.slice(7)) || {});
      return portrait(r, slot, opt, v);
    }
    if (r.kind === 'prop') return slot.startsWith('state:') ? propArt(r, 'front', base(r).sheet.front?.opt ?? 0, slot.slice(6)) : propArt(r, slot, opt);
    return placeArt(r, slot, slot.includes(':') ? (base(r).sheet.layout?.opt ?? 0) : opt);
  }
  const thumb = (r) => {
    const v = base(r), first = FIRST[r.kind], s = v.sheet[first];
    if (r.voiceOnly) return `<div class="ph">${ic('wave')}</div><span class="vo tag">voice only</span>`;
    if (s && s.opt !== undefined) return art(r, first, s.opt, v);
    if (s === 'working') return '<div class="ph"><span class="small">Generating…</span></div>';
    return `<div class="ph">${ic(r.kind === 'character' ? 'user' : r.kind === 'prop' ? 'key' : 'pin')}</div>`;
  };

  // ------------------------------------------------------------ routes: #/<tab>[/<kind>[/<ref>[/<room tab>]]]
  // the page keeps its own place (a shared page can't lean on the address bar); every in-page link goes through go()
  let here = (location.hash || '').replace(/^#\/?/, '');
  const TABS_OK = ['references', 'production', 'brainstorm', 'script'];
  const route = () => { const [tab = 'references', a = 'characters', b = '', c = ''] = here.split('/').filter(Boolean); return TABS_OK.includes(tab) ? { tab, a, b, c } : { tab: 'references', a: 'characters', b: '', c: '' }; };
  function go(h) { here = String(h).replace(/^#\/?/, ''); try { history.replaceState(null, '', `#/${here}`); } catch {} S.menu = null; S.gen = null; S.adding = null; render(true); }
  document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="#"]'); if (!a) return; e.preventDefault(); go(a.getAttribute('href')); });

  // ------------------------------------------------------------ the header
  const menu = (id, items, cls = '') => (S.menu === id ? `<div class="menu ${cls}">${items.join('')}</div>` : '');
  const mi = (act, icon, label, data = {}, cls = '', sub = '') => `<button class="mi ${cls}" data-act="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${icon ? ic(icon, 's') : ''}${label}${sub ? `<span class="msub">${sub}</span>` : ''}</button>`;
  const menuBtn = (id, icon = 'more', cls = '') => `<button class="icon ${cls} ${S.menu === id ? 'on' : ''}" data-act="menu" data-menu="${id}" title="more">${ic(icon)}</button>`;
  const progress = () => {
    const done = S.refs.filter((r) => !r.notUsed);
    return { brainstorm: 1, references: done.filter((r) => base(r).status === 'approved').length / done.length, script: 0.75, production: 0 };
  };
  function header(r) {
    const TABS = [['brainstorm', 'Brainstorm', 'spark'], ['references', 'References', 'refs'], ['script', 'Script', 'script'], ['production', 'Production', 'film']];
    const counts = { character: 0, prop: 0, location: 0 };
    S.refs.forEach((x) => counts[x.kind]++);
    let sub = '';
    if (r.tab === 'references') {
      const kind = KIND[r.a] || 'character';
      sub = `<div class="sl"></div><nav class="segs">${[['characters', 'Characters', 'character'], ['props', 'Props', 'prop'], ['locations', 'Locations', 'location']].map(([k, n, kk]) => `<a class="seg ${r.a === k ? 'on' : ''}" href="#/references/${k}">${n} <span class="n">${counts[kk]}</span></a>`).join('')}</nav>
        <div class="sr"></div>`;
    } else if (r.tab === 'brainstorm') {
      sub = `<div class="sl"></div><nav class="segs"><span class="seg on">Sessions</span><span class="seg">Promoted <span class="badge">2</span></span><span class="seg">History</span></nav><div class="sr"></div>`;
    } else if (r.tab === 'script') {
      sub = `<div class="sl"><button class="varpill small">Main ${ic('chevron', 's chev')}</button></div><nav class="segs"><span class="seg">Home</span><span class="seg on">Write</span><span class="seg">Board</span><span class="seg">Shots</span></nav><div class="sr"><button class="icon" title="The Bible">${ic('book')}</button><button class="icon" title="History">${ic('history')}</button></div>`;
    } else {
      const snd = r.a === 'sound';
      sub = `<div class="sl"></div><nav class="segs"><a class="seg ${snd ? '' : 'on'}" href="#/production">Frames</a><span class="seg dim">Video</span><a class="seg ${snd ? 'on' : ''}" href="#/production/sound">Sound</a><span class="seg dim">Cut</span></nav><div class="sr"></div>`;
    }
    const projects = [['Rainline', true], ['Any Film', false], ['test', false]];
    return `<div class="head"><header class="top">
        <div class="tl"><a class="logo" href="#/references/characters" title="all projects">π</a>
          <div class="menuwrap"><button class="pill ${S.menu === 'proj' ? 'on' : ''}" data-act="menu" data-menu="proj">${pie(progress())}<span class="pn">Rainline</span>${ic('chevron', 'chev')}</button>
          ${menu('proj', [mi('toast', 'grid', 'Overview', { t: 'Overview: the project page as it is now, opened from here.' }), '<div class="msep"></div>', '<div class="mlabel">Projects</div>', ...projects.map(([n, here]) => mi(here ? 'noop' : 'toast', '', `${pie(here ? progress() : { brainstorm: 0.5 }, here ? '#1b36a8' : '#0b6b78', 18)}<span>${n}</span>`, { t: `Would open ${n} in this same tab.` }, here ? 'cur' : '', here ? 'here' : '')), mi('toast', 'grid', 'All projects', { t: 'All projects: the home page.' })])}</div></div>
        <nav class="tabs">${TABS.map(([k, n, icn]) => `<a class="tab ${r.tab === k ? 'on' : ''}" href="#/${k}${k === 'references' ? '/characters' : ''}">${ic(icn)}<span class="tl2">${n}</span></a>`).join('')}</nav>
        <div class="tr"><span class="people"><span class="av ${S.me === 'Hadi' ? 'me' : ''}" title="Hadi">H</span><span class="av ${S.me === 'Abdallah' ? 'me' : ''}" title="Abdallah">A</span></span>
          <div class="menuwrap">${menuBtn('more')}${menu('more', [mi('as', 'user', `You are <b>${S.me}</b> · be ${S.me === 'Hadi' ? 'Abdallah' : 'Hadi'}`)], 'right')}</div></div>
      </header><div class="sub">${sub}</div></div>`;
  }

  // ------------------------------------------------------------ References: the gallery
  function attention(kind) {
    const items = [];
    S.refs.forEach((r) => {
      if (r.owner !== S.me || r.kind !== kind) return;
      r.variants.forEach((v, i) => {
        const where = `#/references/${PLURAL[r.kind]}/${r.id}`;
        if (v.status === 'awaiting') items.push([where, `${r.name} · ${v.name}`, `${v.range}, waiting to be generated`, r.id, v.id]);
        else if (v.status === 'review') items.push([where, i ? `${r.name} · ${v.name}` : r.name, 'yours to approve', r.id, v.id]);
        else if (v.status === 'draft' && !r.notUsed && !r.voiceOnly && i === 0) items.push([where, r.name, 'no images yet', r.id, v.id]);
      });
      if (r.notUsed) items.push([`#/references/${PLURAL[r.kind]}/${r.id}`, r.name, 'not in any placed scene', r.id, 'default']);
    });
    if (!items.length) return '';
    const head = `<button class="attn" data-act="attn">${'<span class="dot"></span>'}<b>${plural(items.length, 'thing')} for you</b><span>· ${esc(items[0][1])}: ${esc(items[0][2])}${items.length > 1 ? ` · and ${items.length - 1} more` : ''}</span>${ic('chevron', 'chev')}</button>`;
    return head + (S.attnOpen ? `<div class="attnlist">${items.map(([h, n, why, rid, vid]) => `<a href="${h}" data-act="go-var" data-ref="${rid}" data-v="${vid}">${thumbMini(ref(rid))}<b>${esc(n)}</b><span class="why">${esc(why)}</span></a>`).join('')}</div>` : '');
  }
  const thumbMini = (r) => `<span class="rchip" style="padding:0;border:0;background:none"><span class="th ${r.kind === 'character' ? '' : 'sq'}">${r.voiceOnly ? '' : base(r).sheet[FIRST[r.kind]]?.opt !== undefined ? art(r, FIRST[r.kind], base(r).sheet[FIRST[r.kind]].opt, base(r)) : ''}</span></span>`;
  function gallery(r) {
    const kind = KIND[r.a] || 'character';
    const list = S.refs.filter((x) => x.kind === kind);
    const cards = list.map((x) => {
      const v = base(x), mid = `card:${x.id}`;
      const extra = x.variants.length > 1 ? `<span class="tag">+${x.variants.length - 1} variant</span>` : x.kind === 'location' && x.areas.length ? `<span class="tag">${plural(x.areas.length, 'area')}</span>` : '';
      return `<div class="rc ${x.notUsed ? 'off' : ''}" data-act="open-ref" data-href="#/references/${PLURAL[x.kind]}/${x.id}">
        <div class="frame">${thumb(x)}</div>
        <div class="meta"><span class="nm">${esc(x.name)}</span><span class="ln">${esc(x.line)}</span><span class="row">${st(status(x))}<span class="grow"></span>${extra}${x.ai.length || x.voiceAi ? '<span class="tag ai">AI-suggested</span>' : ''}</span></div>
        <div class="cmenu menuwrap ${S.menu === mid ? 'open' : ''}">${menuBtn(mid)}</div>
        <div class="menuwrap cardmw">${menu(mid, [mi('toast', 'copy', 'Copy to a project…', { t: 'Copies the card and its images into the other project. The two then change on their own.' }), mi('toast', 'user', `Owner: ${x.owner}`, { t: 'The owner can change any time. No roles.' }), '<div class="msep"></div>', mi('toast', 'trash', 'Delete', { t: 'Delete: not in the demo.' }, 'danger')])}</div>
      </div>`;
    });
    const nf = S.newForm === kind
      ? `<form class="rc newform" data-form="new"><div class="small muted">A new ${NOUN[kind]}</div><input id="new-name" data-newname placeholder="${kind === 'character' ? 'Name' : kind === 'prop' ? 'What is it?' : 'The place'}" maxlength="60" autocomplete="off"><div class="acts"><button class="primary small">Create</button><button type="button" class="ghost small" data-act="new-x">Cancel</button></div></form>`
      : `<button class="rc new" data-act="new-open"><span class="plus">${ic('plus', 'l')}</span><span>New ${NOUN[kind]}</span></button>`;
    return `<main class="page">${attention(kind)}<div class="rgrid ${kind === 'location' ? 'wide' : kind === 'prop' ? 'props' : ''}">${cards.join('')}${nf}</div></main>`;
  }

  // ------------------------------------------------------------ References: one card's room
  function slotHtml(r, v, slot, cls = '', label = SLOTNAME[slot]) {
    const s = v.sheet[slot], first = FIRST[r.kind], hasFirst = v.sheet[first] && v.sheet[first].opt !== undefined;
    const lab = label ? `<span class="slab">${esc(label)}</span>` : '';
    if (s === 'working') return `<div class="slot working ${cls}">${lab}<div class="in">${slot === first ? 'Making 4 options…' : `From the ${first === 'layout' ? 'layout' : 'front'}…`}</div></div>`;
    if (s && s.opt !== undefined) return `<div class="slot ${cls}">${art(r, slot, s.opt, v)}${lab}<div class="sacts"><button data-act="gen" data-ref="${r.id}" data-slot="${slot}" data-fix="1">${ic('edit', 's')}Fix</button><button data-act="gen" data-ref="${r.id}" data-slot="${slot}">${ic('refresh', 's')}Redo</button></div></div>`;
    if (slot === first) {
      const from = v.id !== 'default' ? `from the Default ${first === 'layout' ? 'layout' : 'front'}` : first === 'layout' ? 'one wide view of the whole place' : '3–4 options to pick from';
      return `<div class="slot empty ${cls}">${lab}<div class="in"><button class="small" data-act="gen" data-ref="${r.id}" data-slot="${slot}">${ic('sparkle', 's')}Generate</button><span>${from}</span></div></div>`;
    }
    return `<div class="slot empty ${cls}">${lab}<div class="in">${hasFirst ? `<button class="small ghost" data-act="gen" data-ref="${r.id}" data-slot="${slot}">${ic('sparkle', 's')}Generate</button>` : `<span>made from the ${first === 'layout' ? 'layout' : 'front'}</span>`}</div></div>`;
  }
  const fieldsHtml = (r, list, aiKeys, key = 'fields') => `<div class="flds">${list.map(([k, l, val]) => `<div class="fld"><div class="lb">${esc(l)}${aiKeys.includes(k) ? '<span class="tag ai" data-aitag>AI-suggested</span>' : ''}</div><div class="val" contenteditable="true" spellcheck="false" data-ref="${r.id}" data-field="${esc(k)}" data-list="${key}" data-ph="—">${esc(val)}</div></div>`).join('')}</div>`;
  function dirtyLine(r) {
    const v = base(r), n = v.usedIn.length;
    return `<div class="dirty ${S.dirty[r.id] ? 'on' : ''}" data-dirty="${r.id}">${ic('alert', 's')}<span><b>${esc(r.name)}</b> is approved. Saving makes v${v.version + 1} and marks ${plural(n, 'shot')} Stale.</span><span class="grow"></span><button class="small primary" data-act="save-version" data-ref="${r.id}">Save as v${v.version + 1}</button><button class="small ghost" data-act="undo-edit" data-ref="${r.id}">Undo</button></div>`;
  }
  function usedLine(r, v) {
    const shots = v.usedIn.length ? v.usedIn.map((n) => `<a class="sn" href="#/production" title="shot ${n}">${n}</a>`).join('') : '<span class="faint">no shots yet</span>';
    return `<div class="usedin"><span>Used in</span>${shots}<button class="vlink" data-act="toast" data-t="Versions open in their own room: v1, v2… each with who changed what and which shots were made with it.">${v.version ? `v${v.version} · ` : ''}Versions ${ic('history', 's')}</button></div>`;
  }
  function roomHead(r, v, kindLabel) {
    const varMenu = `vmenu:${r.id}`, oMenu = `omenu:${r.id}`, rMenu = `rmenu:${r.id}`;
    const vs = status(r, v);
    const approve = vs === 'review' ? (r.owner === S.me ? `<button class="small primary" data-act="approve" data-ref="${r.id}">${ic('check', 's')}Approve</button>` : `<span class="waits">${esc(r.owner)} approves this one</span>`) : '';
    const variants = r.kind !== 'location' && !r.voiceOnly ? `<div class="menuwrap"><button class="varpill ${v.id !== 'default' ? 'alt' : ''}" data-act="menu" data-menu="${varMenu}">${esc(v.name)}${v.range ? ` <span class="${v.id !== 'default' ? '' : 'faint'}">· ${esc(v.range)}</span>` : ''} ${ic('chevron', 'chev')}</button>
        ${menu(varMenu, ['<div class="mlabel">Lasting changes</div>', ...r.variants.map((x) => mi('variant', '', `${esc(x.name)}`, { ref: r.id, v: x.id }, x.id === v.id ? 'cur' : '', `${esc(x.range || '')} · ${ST[status(r, x)][0]}`)), '<div class="msep"></div>', mi('toast', 'plus', 'Add a lasting change…', { t: 'By hand: a haircut, aged 10 years, the burned café. Wet, crying or muddy stay in the script.' })])}</div>` : '';
    return `<a class="backl" href="#/references/${PLURAL[r.kind]}">${ic('back', 's')}${kindLabel}</a>
      <div class="rhead"><h1>${esc(r.name)}</h1>${st(vs)}${variants}<span class="grow"></span>${approve}
        <div class="menuwrap"><button class="owner" data-act="menu" data-menu="${oMenu}"><span class="mini ${r.owner === S.me ? 'me' : ''}">${r.owner[0]}</span>${esc(r.owner)} · owner</button>${menu(oMenu, ['<div class="mlabel">Who approves it</div>', ...['Hadi', 'Abdallah'].map((n) => mi('owner', '', n, { ref: r.id, n }, r.owner === n ? 'cur' : ''))], 'right')}</div>
        <div class="menuwrap">${menuBtn(rMenu)}${menu(rMenu, [mi('toast', 'history', 'Versions', { t: 'Versions: their own room.' }), mi('toast', 'copy', 'Copy to another project…', { t: 'Copies the card and its images. The two then change on their own.' }), '<div class="msep"></div>', mi('toast', 'trash', 'Delete', { t: 'Delete: not in the demo.' }, 'danger')], 'right')}</div>
        <div class="rsub">${esc(r.line)}</div></div>`;
  }
  const roomTabs = (r, tabs, cur) => `<nav class="segs inroom">${tabs.map(([k, n, c]) => `<a class="seg ${cur === k ? 'on' : ''}" href="#/references/${PLURAL[r.kind]}/${r.id}${k === tabs[0][0] ? '' : `/${k}`}">${n}${c !== undefined ? ` <span class="n">${c}</span>` : ''}</a>`).join('')}</nav>`;

  function characterRoom(r, sub) {
    const v = vOf(r);
    const tabs = r.voiceOnly ? [['look', 'Look'], ['voice', 'Voice']] : [['look', 'Look'], ['expressions', 'Expressions', r.expressions.length], ['outfits', 'Outfits', r.outfits.length], ['motion', 'Motion'], ['voice', 'Voice']];
    const cur = tabs.some(([k]) => k === sub) ? sub : 'look';
    let body = '';
    if (cur === 'look') {
      if (r.voiceOnly) {
        body = `<div class="rbody"><div class="voiceonly">${ic('wave')}<div><b>Heard, never seen.</b><br>${esc(r.name)} is only a voice on the radio in sc. 1.</div><button class="small" data-act="give-face" data-ref="${r.id}">${ic('user', 's')}Give them a face</button></div><div><div class="srcline" style="margin-top:0">${ic('script', 's')}${esc(r.source)}</div><p class="muted small" style="margin-top:14px">The Voice tab is what matters for this one.</p></div></div>`;
      } else {
        const right = v.id === 'default'
          ? `${fieldsHtml(r, r.fields, r.ai)}${dirtyLine(r)}<div class="srcline">${ic('script', 's')}${esc(r.source)}</div>`
          : `<div class="flds"><div class="fld"><div class="lb">What changes</div><div class="val" contenteditable="true" spellcheck="false">${esc(v.delta)}</div></div><div class="fld"><div class="lb">Everything else</div><div class="muted">As Default (v${base(r).version})</div></div><div class="fld"><div class="lb">Starts at</div><div>${esc(v.range.replace(/^from /, ''))}, and stays. Shots from there on use it, unless a shot says otherwise.</div></div></div><div class="srcline">${ic('sparkle', 's')}${esc(v.auto)}</div>`;
        body = `<div class="rbody"><div class="sheet">${slotHtml(r, v, 'front', 'big')}${slotHtml(r, v, 'side')}${slotHtml(r, v, 'back')}</div><div>${right}</div></div>`;
      }
    } else if (cur === 'expressions') {
      const done = v.id === 'default' ? r.exprDone : v.exprDone;
      const exprWorking = v.exprWorking;
      body = `<div class="tiles">${r.expressions.map(([ex, by]) => `<div class="tile"><div class="slot ${exprWorking ? 'working' : done ? '' : 'empty'}">${exprWorking ? '<div class="in">…</div>' : done ? art(r, `expr:${ex}`, 0, v) + `<div class="sacts"><button data-act="toast" data-t="Redo makes 3–4 options for this expression, from the front.">${ic('refresh', 's')}Redo</button></div>` : `<div class="in"><span>made from the front</span></div>`}</div><div class="tn">${esc(ex[0].toUpperCase() + ex.slice(1))}${by ? `<span class="tag">added by ${esc(by)}</span>` : ''}</div></div>`).join('')}
        <div class="tile add">${S.adding === 'expr' ? `<div class="slot" style="border-style:solid">${ic('plus', 'l')}</div><input id="add-input" data-add="expr" placeholder="exhausted, disgusted…" maxlength="30" autocomplete="off">` : `<div class="slot" data-act="add" data-what="expr">${ic('plus', 'l')}</div><div class="tn faint">Add an expression</div>`}</div></div>`;
    } else if (cur === 'outfits') {
      body = `<div class="tiles outfits">${r.outfits.map((o) => `<div class="tile"><div class="slot">${o.done ? art(r, `outfit:${o.id}`) : '<div class="in">…</div>'}<div class="sacts"><button data-act="toast" data-t="Fix by prompt: “the jacket is longer”.">${ic('edit', 's')}Fix</button></div></div><div class="tn">${esc(o.name)}${o.main ? '<span class="tag">main</span>' : ''}</div><div class="td">${esc(o.note)}</div></div>`).join('')}
        <div class="tile add">${S.adding === 'outfit' ? `<div class="slot" style="border-style:solid">${ic('plus', 'l')}</div><input id="add-input" data-add="outfit" placeholder="work suit, pajamas, night out…" maxlength="40" autocomplete="off">` : `<div class="slot" data-act="add" data-what="outfit">${ic('plus', 'l')}</div><div class="tn faint">Add an outfit</div>`}</div></div>`;
    } else if (cur === 'motion') {
      const mm = MEDIA.motion[r.id], paused = S.clipPaused[r.id] ?? S.calm;
      const clip = S.clipMaking === r.id ? `<div class="clip working"><span class="slab">Clip</span><div class="in">Making a new clip…</div></div>`
        : mm ? `<div class="clip ${paused ? 'paused' : ''}"><video src="${mm.src}" poster="${mm.poster}" ${paused ? '' : 'autoplay'} muted loop playsinline data-clip="${r.id}"></video><span class="slab">Clip · ${mm.dur} s, loops</span><button class="cplay" data-act="clip" data-id="${r.id}" title="Play / pause">${ic(paused ? 'play' : 'pause', 'fill')}</button><div class="sacts"><button data-act="toast" data-t="Fix by prompt, like “slower at the lights”: 3–4 new clips to pick from.">${ic('edit', 's')}Fix</button><button data-act="clip-redo" data-id="${r.id}">${ic('refresh', 's')}Redo</button></div><div class="cbar"><i data-cbar="${r.id}"></i></div></div>`
        : `<div class="clip empty"><span class="slab">Clip</span><div class="in"><button class="small" data-act="toast" data-t="In the app this makes 3–4 short clips from the front and the text, with the video model.">${ic('sparkle', 's')}Generate a clip</button><span>from the front and the text</span></div></div>`;
      body = `<div class="rbody"><div>${clip}</div><div><div class="lb muted small" style="margin-bottom:8px">How ${esc(r.name)} moves</div><div class="val prose" contenteditable="true" spellcheck="false" data-motion="${r.id}" data-ph="Walk, posture, gestures, energy.">${esc(r.motion)}</div><div class="srcline">${ic('sparkle', 's')}The clip is made from the front and this text.</div><div class="dirty ${S.motionDirty[r.id] ? 'on' : ''}" data-mdirty="${r.id}">${ic('alert', 's')}<span>The clip was made from an older text.</span><span class="grow"></span><button class="small" data-act="clip-redo" data-id="${r.id}">Redo the clip</button></div></div></div>`;
    } else {
      const m = MEDIA.voice[r.id], line = (r.voice.find(([l]) => l === 'Sample line') || [])[1] || '';
      const sample = `<div class="sample"><div class="lb muted small">Sample</div>${m ? player(r.id) + (line ? `<div class="sline">${esc(line)}</div>` : '') : '<div class="faint small">No sample yet.</div>'}
        <div class="dirty ${S.voiceDirty[r.id] ? 'on' : ''}" data-vdirty="${r.id}">${ic('alert', 's')}<span>Made from an older description.</span></div>
        <div class="smeta"><span>Made in Sound, from this description.</span><span class="grow"></span><a class="btn" href="#/production/sound/${r.id}">${ic('wave', 's')}Open in Sound</a></div></div>`;
      body = `<div class="rbody"><div>${fieldsHtml(r, r.voice.map(([l, val], i) => [`v${i}`, l, val]), r.voiceAi ? r.voice.map((_, i) => `v${i}`) : [], 'voice')}</div><div>${sample}</div></div>`;
    }
    return `<main class="page">${roomHead(r, v, 'Characters')}${roomTabs(r, tabs, cur)}${body}${usedLine(r, v)}</main>`;
  }
  function propRoom(r, sub) {
    const v = base(r);
    const tabs = [['look', 'Object sheet'], ['scale', 'Scale'], ['states', 'States', r.states.length]];
    const cur = tabs.some(([k]) => k === sub) ? sub : 'look';
    let body;
    if (cur === 'look') body = `<div class="rbody"><div class="sheet props">${slotHtml(r, v, 'front', 'big')}${slotHtml(r, v, 'side')}${slotHtml(r, v, 'back')}${slotHtml(r, v, 'top')}<div></div></div><div>${fieldsHtml(r, r.fields, r.ai)}${dirtyLine(r)}<div class="srcline">${ic('user', 's')}${esc(r.source)}</div></div></div>`;
    else if (cur === 'scale') body = `<div class="rbody"><div style="max-width:420px">${slotHtml(r, v, 'scale', '', 'Next to a person')}</div><div><p class="muted small">So its size doesn’t change between shots. Made from the front once it’s picked.</p></div></div>`;
    else body = `<div class="tiles">${r.states.map((s) => `<div class="tile"><div class="slot">${s.done && v.sheet.front?.opt !== undefined ? art(r, `state:${s.id}`) : '<div class="in"></div>'}</div><div class="tn">${esc(s.name)}${s.main ? '<span class="tag">default</span>' : ''}</div><div class="td">${esc(s.note || '')}</div></div>`).join('')}
      <div class="tile add">${S.adding === 'state' ? `<div class="slot" style="border-style:solid">${ic('plus', 'l')}</div><input id="add-input" data-add="state" placeholder="new, broken, open, bloody…" maxlength="30" autocomplete="off">` : `<div class="slot" data-act="add" data-what="state">${ic('plus', 'l')}</div><div class="tn faint">Add a state</div>`}</div></div>`;
    return `<main class="page">${roomHead(r, v, 'Props')}${roomTabs(r, tabs, cur)}${body}${usedLine(r, v)}</main>`;
  }
  function locationRoom(r, sub) {
    const v = base(r);
    const tabs = [['look', 'Layout'], ['elements', 'Elements', r.elements.length], ['texture', 'Texture', r.textures.length], ['light', 'Light', r.lights.length]];
    const cur = tabs.some(([k]) => k === sub) ? sub : 'look';
    const hasLayout = v.sheet.layout && v.sheet.layout.opt !== undefined;
    const ready = (x) => hasLayout && x.done !== false;
    // everything in a location is made from its layout view, so it waits for that and fills in together
    const fill = (x, inner, cls = '') => `<div class="slot ${cls} ${v.making ? 'working' : ready(x) ? '' : 'empty'}">${v.making ? '<div class="in">From the layout…</div>' : ready(x) ? inner : '<div class="in"><span>made from the layout</span></div>'}</div>`;
    const redo = (what) => `<div class="sacts"><button data-act="toast" data-t="Fix by prompt: 3–4 new options for this ${what}, from the layout.">${ic('edit', 's')}Fix</button><button data-act="toast" data-t="Redo makes 3–4 new options for this ${what}, from the layout.">${ic('refresh', 's')}Redo</button></div>`;
    const addTile = (what, ph, label) => `<div class="tile add">${S.adding === what ? `<div class="slot" style="border-style:solid">${ic('plus', 'l')}</div><input id="add-input" data-add="${what}" placeholder="${ph}" maxlength="40" autocomplete="off">` : `<div class="slot" data-act="add" data-what="${what}">${ic('plus', 'l')}</div><div class="tn faint">${label}</div>`}</div>`;
    let body;
    if (cur === 'look') {
      const regs = r.regulars.map((id) => { const c = ref(id); return `<a class="reg" href="#/references/characters/${c.id}"><span class="face">${art(c, 'front', base(c).sheet.front?.opt ?? 0, base(c))}</span>${esc(c.name)}</a>`; }).join('');
      const areas = `<div class="lb muted small" style="margin-top:20px">Areas <span class="faint">· where scenes happen</span></div><div class="tiles areas">${r.areas.map((x) => `<div class="tile">${fill(x, art(r, `area:${x.id}`) + redo('area'))}<div class="tn">${esc(x.name)}</div><div class="td">${esc(x.scenes || '')}</div></div>`).join('')}${addTile('area', 'kitchen, counter…', 'Add an area')}</div>`;
      body = `<div class="rbody"><div>${slotHtml(r, v, 'layout', 'wide', 'Layout view')}${areas}</div>
        <div>${fieldsHtml(r, r.fields, r.ai)}${dirtyLine(r)}
          <div class="lb muted small" style="margin-top:20px">From the script</div><div style="margin:6px 0 4px"><span class="script-h">${esc(r.heading)}</span></div><div class="muted small">${esc(r.name)} → ${r.areas.length ? esc(r.areas.map((x) => x.name).join(', ')) : 'no areas yet'}. The time of day comes from the script.</div>
          <div class="lb muted small" style="margin-top:18px">Regulars</div>${regs ? `<div class="regs">${regs}</div>` : '<div class="faint small" style="margin-top:4px">Nobody lives or works here.</div>'}</div></div>`;
    } else if (cur === 'elements') {
      body = `<div class="tiles wide">${r.elements.map((x) => `<div class="tile">${fill(x, art(r, `el:${x.id}`) + redo('element'))}<div class="tn">${esc(x.name)}</div><div class="td">${esc(x.note)}</div></div>`).join('')}${addTile('element', 'a window, the counter, the tanks…', 'Add an element')}</div>`;
    } else if (cur === 'texture') {
      body = `<div class="tiles">${r.textures.map((x) => `<div class="tile">${fill(x, textureArt(x.kind) + redo('texture'))}<div class="tn">${esc(x.name)}</div><div class="td">${esc(x.where)}</div></div>`).join('')}${addTile('texture', 'brick, tiles, wet stone…', 'Add a texture')}</div>`;
    } else {
      const rows = r.lights.map((l) => `<div class="lrow"><div class="lt ${v.making ? 'working' : ready(l) ? '' : 'empty'}">${!v.making && ready(l) ? lightTile(l) : ''}</div><div class="grow"><div class="tn">${esc(l.name)}</div><div class="td">${esc(l.quality)}</div>${l.note ? `<div class="td faint">${esc(l.note)}</div>` : ''}</div></div>`).join('');
      body = `<div class="rbody"><div>${fill({}, lightPlan(r), 'wide')}<p class="faint small" style="margin-top:10px">The place’s own light. Time of day and weather come from the script and sit on top of it.</p></div>
        <div><div class="lb muted small" style="margin-bottom:4px">Sources</div>${rows || '<div class="faint small">No light sources yet.</div>'}${S.adding === 'light' ? `<input id="add-input" data-add="light" placeholder="a neon sign, a fridge door…" maxlength="40" autocomplete="off" style="margin-top:10px">` : `<button class="small ghost" style="margin-top:10px" data-act="add" data-what="light">${ic('plus', 's')}Add a light</button>`}</div></div>`;
    }
    return `<main class="page">${roomHead(r, v, 'Locations')}${roomTabs(r, tabs, cur)}${body}${usedLine(r, v)}</main>`;
  }

  // ------------------------------------------------------------ textures and light, drawn in code (SVG noise, gradients)
  let uid = 0;
  const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255].map((x) => x.toFixed(3)); };
  const noise = (id, [freq, oct, seed, color, a, b]) => { const [r, g, bl] = rgb(color); return `<filter id="${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 ${r} 0 0 0 0 ${g} 0 0 0 0 ${bl} ${a} 0 0 0 ${b}"/></filter>`; };
  const TEX = {
    concrete: { base: '#b8b5ac', layers: [[0.9, 3, 3, '#000000', 0.8, -0.32], [1.6, 2, 7, '#ffffff', 0.8, -0.34], [0.045, 2, 11, '#7a7873', 9, -5.9]] },
    steel: { base: '#a8abb1', layers: [['0.012 0.5', 2, 5, '#000000', 0.8, -0.32], ['0.02 0.12', 3, 9, '#9a6a4c', 7, -4.5], [1.4, 2, 4, '#ffffff', 0.6, -0.27]] },
    paint: { base: '#4e6a5d', layers: [[0.06, 3, 6, '#b3ae9f', 14, -8.3], [1.2, 2, 3, '#000000', 0.6, -0.26], [0.5, 2, 8, '#ffffff', 0.5, -0.22]] },
    plaster: { base: '#e5e0d5', layers: [[0.45, 3, 2, '#7d7464', 0.7, -0.3], [0.025, 2, 12, '#cdbb92', 4, -2.3]] },
    lino: { base: '#c8c0ac', defs: (id) => `<pattern id="${id}p" width="25" height="25" patternUnits="userSpaceOnUse"><rect width="12.5" height="12.5" fill="#a99e86"/><rect x="12.5" y="12.5" width="12.5" height="12.5" fill="#a99e86"/></pattern>`, under: (id) => `<rect width="100" height="100" fill="url(#${id}p)"/>`, layers: [[0.8, 2, 4, '#000000', 0.6, -0.26], [0.07, 2, 9, '#e9e4d6', 6, -3.6]] },
    formica: { base: '#d9d3c4', layers: [[2.4, 1, 3, '#000000', 1.2, -0.66], [2.0, 1, 8, '#ffffff', 1.2, -0.64]] },
    asphalt: { base: '#55555a', layers: [[1.8, 2, 4, '#ffffff', 1.2, -0.72], [0.7, 3, 6, '#000000', 0.8, -0.32]] },
    lanepaint: { base: '#4b4b50', under: () => '<rect y="34" width="100" height="30" fill="#e8e6df"/>', layers: [[0.9, 3, 6, '#55555a', 2.4, -1.4], [1.8, 2, 4, '#ffffff', 1.2, -0.72]] },
    stone: { base: '#b5aa96', defs: (id) => `<pattern id="${id}p" width="50" height="26" patternUnits="userSpaceOnUse"><path d="M0 .5H50M0 13.5H50M25 0V13M0 13V26M50 13V26" stroke="#857b69" stroke-width="1.3" fill="none"/></pattern>`, over: (id) => `<rect width="100" height="100" fill="url(#${id}p)" opacity=".8"/>`, layers: [[0.35, 4, 5, '#000000', 0.8, -0.32], [1.3, 2, 3, '#ffffff', 0.6, -0.27]] },
    iron: { base: '#6e4b37', layers: [[0.25, 4, 3, '#2e2018', 1.1, -0.45], [0.9, 3, 7, '#b06d3e', 1.1, -0.5]] },
    canvas: { base: '#9aa4c4', defs: (id) => `<pattern id="${id}s" width="24" height="100" patternUnits="userSpaceOnUse"><rect width="12" height="100" fill="#e7e5df"/></pattern><pattern id="${id}w" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H4M1 0V4" stroke="#000" stroke-opacity=".12" stroke-width="1"/></pattern>`, under: (id) => `<rect width="100" height="100" fill="url(#${id}s)"/>`, over: (id) => `<rect width="100" height="100" fill="url(#${id}w)"/>`, layers: [[0.6, 3, 4, '#000000', 0.6, -0.26]] },
  };
  function textureArt(kind) {
    const T = TEX[kind] || TEX.plaster, id = `tx${++uid}`;
    const defs = T.layers.map((l, i) => noise(`${id}-${i}`, l)).join('') + (T.defs ? T.defs(id) : '');
    return `<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs><rect width="100" height="100" fill="${T.base}"/>${T.under ? T.under(id) : ''}${T.layers.map((_, i) => `<rect width="100" height="100" filter="url(#${id}-${i})"/>`).join('')}${T.over ? T.over(id) : ''}</svg>`;
  }
  function lightTile(l) {
    const id = `lt${++uid}`, gy = l.kind === 'glow' ? 100 : l.kind === 'flood' ? 18 : 46;
    const glyph = { bulb: `<path d="M50 0v36" stroke="#5a5a60" stroke-width="1.6"/><circle cx="50" cy="44" r="6" fill="${l.color}"/>`, window: `<rect x="28" y="26" width="44" height="40" rx="1" fill="${l.color}" fill-opacity=".25" stroke="#8d96ab" stroke-width="2"/><path d="M50 26v40M28 46h44" stroke="#8d96ab" stroke-width="1.6"/>`, lamp: `<path d="M44 100V40h12" stroke="#6a6a70" stroke-width="2.6" fill="none"/><circle cx="58" cy="42" r="4.5" fill="${l.color}"/>`, flood: `<rect x="40" y="12" width="20" height="8" rx="1" fill="${l.color}"/><path d="M50 20v80" stroke="#55555a" stroke-width="2"/>` }[l.kind] || '';
    return `<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="${id}" cx="50" cy="${gy}" r="${l.kind === 'glow' ? 80 : 46}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${l.color}" stop-opacity=".95"/><stop offset=".45" stop-color="${l.color}" stop-opacity=".35"/><stop offset="1" stop-color="${l.color}" stop-opacity="0"/></radialGradient></defs><rect width="100" height="100" fill="#1c1d23"/><rect width="100" height="100" fill="url(#${id})"/>${glyph}</svg>`;
  }
  // the layout view at night-neutral darkness with each source's light where it sits
  function lightPlan(r) {
    const opt = base(r).sheet.layout?.opt ?? 0;
    const t = `${opt % 2 === 1 ? 'translate(320 0) scale(-1 1)' : ''}${opt >= 2 ? ' translate(0 6)' : ''}`;
    let defs = '', glows = '';
    r.lights.forEach((l) => { const id = `lp${++uid}`; defs += `<radialGradient id="${id}"><stop offset="0" stop-color="${l.color}" stop-opacity=".9"/><stop offset=".4" stop-color="${l.color}" stop-opacity=".35"/><stop offset="1" stop-color="${l.color}" stop-opacity="0"/></radialGradient>`; (l.at || []).forEach(([x, y]) => (glows += `<circle cx="${x}" cy="${y}" r="${l.r || 60}" fill="url(#${id})"/>`)); });
    return `<svg class="art" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs><rect class="bg" width="320" height="180"/><g transform="${t}">${PLACES[r.place] || ''}</g><rect width="320" height="180" fill="#0b0d16" opacity=".68"/><g transform="${t}" style="mix-blend-mode:screen">${glows}</g></svg>`;
  }

  // ------------------------------------------------------------ voices: play a sample; Production → Sound lists them all
  const fmt = (x) => `0:${String(Math.floor(x)).padStart(2, '0')}`;
  const audio = new Audio();
  audio.addEventListener('ended', () => { S.playing = null; render(); });
  function player(id) {
    const m = MEDIA.voice[id]; if (!m) return '';
    const on = S.playing === id, busy = S.remaking[id];
    return `<div class="player ${busy ? 'busy' : ''}"><button class="play" data-act="play" data-id="${id}" title="${on ? 'Pause' : 'Play'}" ${busy ? 'disabled' : ''}>${ic(on ? 'pause' : 'play', 'fill')}</button><div class="wave" data-act="wave" data-id="${id}" data-wave="${id}">${m.peaks.map((p) => `<i style="height:${Math.max(6, Math.round(p * 100))}%"></i>`).join('')}</div><span class="ptime" data-ptime="${id}">${fmt(m.dur)}</span></div>`;
  }
  function playVoice(id, frac) {
    const m = MEDIA.voice[id]; if (!m) return;
    if (S.playing === id && frac === undefined) { audio.pause(); S.playing = null; return render(); }
    if (S.playing !== id) { audio.src = m.src; audio.currentTime = 0; }
    if (frac !== undefined) audio.currentTime = Math.max(0, Math.min(0.98, frac)) * m.dur;
    S.playing = id;
    audio.play().catch(() => { S.playing = null; render(); toast('The browser held the sound back. Press play again.'); });
    render();
  }
  (function loop() {
    if (S.playing) {
      const m = MEDIA.voice[S.playing], p = Math.min(1, audio.currentTime / m.dur);
      app.querySelectorAll(`[data-wave="${S.playing}"]`).forEach((w) => { const k = Math.round(p * w.children.length); [...w.children].forEach((bar, i) => bar.classList.toggle('past', i < k)); });
      app.querySelectorAll(`[data-ptime="${S.playing}"]`).forEach((el) => (el.textContent = fmt(audio.currentTime)));
    }
    app.querySelectorAll('video[data-clip]').forEach((vd) => { const bar = app.querySelector(`[data-cbar="${vd.dataset.clip}"]`); if (bar && vd.duration) bar.style.width = `${(vd.currentTime / vd.duration) * 100}%`; });
    requestAnimationFrame(loop);
  })();
  function soundPage(focus) {
    const rows = S.refs.filter((x) => x.kind === 'character').map((c) => {
      const m = MEDIA.voice[c.id], vd = (k) => (c.voice.find(([l]) => l === k) || [])[1] || '';
      const sum = [vd('Pitch / tone'), vd('Accent'), vd('Pace / rhythm')].filter(Boolean).join(' · ');
      const face = c.voiceOnly || base(c).sheet.front?.opt === undefined ? ic('wave', 's') : art(c, 'front', base(c).sheet.front.opt, base(c));
      return `<div class="vrow ${focus === c.id ? 'hl' : ''}"><span class="vf">${face}</span><div class="vn"><b>${esc(c.name)}</b><span>${esc(sum || 'No voice description yet')}</span></div>${m ? player(c.id) : '<div class="faint small">No sample yet</div>'}<div class="vacts">${S.voiceDirty[c.id] ? st('stale').replace('Stale', 'older description') : ''}<button class="small" data-act="remake" data-id="${c.id}">${ic('refresh', 's')}${m ? 'Remake' : 'Make'}</button><a class="btn" href="#/references/characters/${c.id}/voice">Description</a></div></div>`;
    }).join('');
    return `<main class="page"><h2 class="secth">Voices <span class="muted small">one sample per character, made from its Voice description in References</span></h2>${rows}
      <h2 class="secth" style="margin-top:30px;color:var(--t3)">Lines <span class="small">every line of dialogue in these voices, shot by shot · next</span></h2></main>`;
  }

  // ------------------------------------------------------------ Generate: the panel, only when asked
  function genPanel() {
    const g = S.gen; if (!g) return '';
    const r = ref(g.ref), v = vOf(r, g.v);
    const slotLabel = SLOTNAME[g.slot] || g.slot;
    const shape = r.kind === 'location' ? 'wideopts' : r.kind === 'prop' ? 'sq' : '';
    const from = v.id !== 'default' ? `<b>${esc(v.name)}</b>: ${esc(v.delta)}.` : r.kind === 'character' ? `<b>${esc(r.name)}</b>: ${esc(r.fields.map((f) => f[2]).filter(Boolean).join(', '))}.` : `<b>${esc(r.name)}</b>: ${esc(r.fields.map((f) => f[2]).filter(Boolean).join(', '))}.`;
    const opts = [0, 1, 2, 3].map((i) => g.phase === 'working'
      ? `<div class="opt working"><div class="in"></div></div>`
      : `<button class="opt" data-act="pick" data-i="${i}">${art(r, g.slot, i, v)}<span class="use">Use this</span></button>`).join('');
    return `<aside class="gen ${shape}">
      <div class="gh"><div class="grow"><div class="gt">${ic('sparkle', 's')} ${esc(slotLabel)} · ${esc(r.name)}${v.id !== 'default' ? ` · ${esc(v.name)}` : ''}</div><div class="gs">${g.phase === 'working' ? 'Making 4 options…' : 'Pick one. The rest are made from it.'}</div></div><button class="icon" data-act="gen-x" title="close">${ic('x')}</button></div>
      <div class="opts">${opts}</div>
      <div class="gfrom">From ${from}${g.fixText ? ` Fix: <b>${esc(g.fixText)}</b>.` : ''}</div>
      <form class="gf" data-form="fix"><input id="gen-fix" data-fix placeholder="Fix: shorter hair, add a scar…" autocomplete="off"><button class="small" title="make 4 new options">${ic('refresh', 's')}</button></form>
    </aside>`;
  }
  function startGen(rid, slot, fix) {
    const r = ref(rid), v = vOf(r);
    S.gen = { ref: rid, v: v.id, slot, phase: 'working', fixText: '' };
    if (v.status !== 'review' && v.status !== 'approved') v.status = 'generating';
    render();
    setTimeout(() => { if (S.gen && S.gen.ref === rid) { S.gen.phase = 'options'; render(); if (fix) app.querySelector('[data-fix]')?.focus(); } }, fix ? 300 : 1300);
  }
  function pick(i) {
    const g = S.gen; const r = ref(g.ref), v = vOf(r, g.v);
    const first = FIRST[r.kind];
    S.gen = null;
    v.sheet[g.slot] = { opt: i };
    if (g.slot !== first) { toast(`${SLOTNAME[g.slot] || g.slot} replaced.`); if (v.status === 'approved') { S.dirty[r.id] = true; } return render(); }
    // the rest are made from the picked one
    const rest = r.kind === 'character' ? ['side', 'back'] : r.kind === 'prop' ? ['side', 'back', 'top', 'scale'] : [];
    rest.forEach((s) => (v.sheet[s] = 'working'));
    if (r.kind === 'character') v.exprWorking = true;
    if (r.kind === 'location') v.making = true;
    v.status = 'review';
    if (S.stale.pendingVariant === v.id) delete S.stale.pendingVariant;
    toast(r.kind === 'location' ? 'Layout picked. Areas, elements, textures and light are made from it.' : r.kind === 'character' ? 'Front picked. Side, back and expressions are made from it.' : 'Front picked. The other angles and the scale are made from it.');
    render();
    setTimeout(() => {
      rest.forEach((s) => (v.sheet[s] = { opt: i }));
      if (r.kind === 'character') { v.exprWorking = false; if (v.id === 'default') r.exprDone = true; else v.exprDone = true; }
      if (r.kind === 'location') { v.making = false; [...r.areas, ...r.elements, ...r.textures, ...r.lights].forEach((x) => (x.done = true)); }
      render();
    }, 1500);
  }

  // ------------------------------------------------------------ Production: where references land (a glimpse of the next section)
  const SCENES = [
    { title: '3 · The rooftop', loc: 'roof', shots: [
      { n: '3.1', fr: 'WS', act: 'Maya waits by the ledge, the envelope inside her jacket.', chars: [['maya', 'default']], area: 'ledge', props: ['envelope'] },
      { n: '3.2', fr: 'MS', act: 'Omar steps out of the stairwell. Wet suit, no umbrella.', chars: [['omar', 'default']], area: 'stair', props: [] },
      { n: '3.4', fr: 'ECU', act: 'He takes one step. She takes one back. Her heel finds the edge.', chars: [['maya', 'default']], area: 'ledge', props: [] },
    ] },
    { title: '4 · Chase', loc: 'alleys', shots: [
      { n: '4.1', fr: 'WS', act: 'Maya flies down the fire escape, three steps at a time.', chars: [['maya', 'cut']], area: 'fire', props: ['satchel'] },
    ] },
  ];
  function refChip(r, v, label, extra = '') {
    const s = status(r, v);
    const has = v.sheet[FIRST[r.kind]]?.opt !== undefined;
    const q = s === 'approved' ? `v${v.version}` : s === 'review' ? 'not approved yet' : s === 'awaiting' ? 'not generated yet' : ST[s][0].toLowerCase();
    return `<a class="rchip ${s === 'awaiting' || s === 'draft' ? 'warn' : ''}" href="#/references/${PLURAL[r.kind]}/${r.id}" data-act="go-var" data-ref="${r.id}" data-v="${v.id}"><span class="th ${r.kind === 'character' ? '' : 'sq'}">${has ? art(r, FIRST[r.kind], v.sheet[FIRST[r.kind]].opt, v) : ''}</span>${label}${extra}<span class="q">· ${q}</span></a>`;
  }
  function production() {
    const scenes = SCENES.map((sc) => {
      const L = ref(sc.loc);
      return `<section class="scn"><h2>${esc(sc.title)}<span class="muted small">${esc(L.heading)}</span></h2>${sc.shots.map((sh) => {
        const chips = [
          ...sh.chars.map(([id, vid]) => { const r = ref(id), v = vOf(r, vid); return refChip(r, v, esc(r.name), v.id !== 'default' ? ` · ${esc(v.name)}` : ''); }),
          refChip(L, base(L), `${esc(L.name)} · ${esc((L.areas.find((a) => a.id === sh.area) || {}).name || '')}`),
          ...sh.props.map((id) => refChip(ref(id), base(ref(id)), esc(ref(id).name))),
          `<span class="rchip addp" data-act="toast" data-t="Props are added to a shot by hand.">${ic('plus', 's')}prop</span>`,
        ].join('');
        const stale = S.stale[sh.n];
        const staleLine = stale ? `<div class="staleline">${ic('alert', 's')}<span>Made with an old ${esc(ref(stale.ref).name)} (v${stale.was}).</span><span class="grow"></span><button class="small" data-act="stale" data-n="${sh.n}" data-how="Kept as it is (a flashback, say).">Keep</button><button class="small" data-act="stale" data-n="${sh.n}" data-how="Regenerating with the new version.">Regenerate</button><button class="small" data-act="stale" data-n="${sh.n}" data-how="Adjusting only what changed.">Adjust</button></div>` : '';
        return `<div class="shot"><div class="kf">The frame comes here, built from these</div><div><div class="sh"><span class="num">${sh.n}</span><span class="fr">${sh.fr}</span>${stale ? st('stale') : ''}</div><div class="act">${esc(sh.act)}</div><div class="rchips">${chips}</div>${staleLine}</div></div>`;
      }).join('')}</section>`;
    }).join('');
    return `<main class="page"><p class="faint small" style="margin:0 0 18px">The next section. Here only to show where references land: each shot picks its characters (the right variant for the scene), its location area, and the props added by hand.</p>${scenes}</main>`;
  }
  const ghost = (name, line) => `<main class="ghostpage"><p>${esc(name)} as it is now. ${esc(line)}</p>${[90, 70, 84, 60, 76, 40].map((w) => `<div class="gl" style="width:${w}%"></div>`).join('')}</main>`;

  // ------------------------------------------------------------ render
  function render(top = false) {
    const r = route();
    let body;
    if (r.tab === 'references') {
      const x = r.b && ref(r.b);
      body = x ? (x.kind === 'character' ? characterRoom(x, r.c) : x.kind === 'prop' ? propRoom(x, r.c) : locationRoom(x, r.c)) : gallery(r);
    } else if (r.tab === 'production') body = r.a === 'sound' ? soundPage(r.b) : production();
    else if (r.tab === 'brainstorm') body = ghost('Brainstorm', 'Its own tabs (Sessions, Promoted, History) moved into the row above; nothing else changes.');
    else body = ghost('Script', 'Its draft switcher, Home · Write · Board · Shots and its rooms moved into the row above; nothing else changes.');
    document.title = `π · Rainline · ${{ references: 'References', production: 'Production', brainstorm: 'Brainstorm', script: 'Script' }[r.tab] || ''}`;
    const y = top ? 0 : window.scrollY;
    app.innerHTML = header(r) + body + genPanel();
    window.scrollTo(0, y);
    if (top) app.querySelector('.vrow.hl')?.scrollIntoView({ block: 'center' });
    const nf = app.querySelector('[data-newname], [data-add]');
    if (nf) nf.focus();
  }

  // ------------------------------------------------------------ actions
  app.addEventListener('click', (e) => {
    if (S.menu && !e.target.closest('.menuwrap')) { S.menu = null; render(); }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const ds = b.dataset, act = ds.act;
    if (act === 'menu') { e.stopPropagation(); S.menu = S.menu === ds.menu ? null : ds.menu; return render(); }
    if (b.classList.contains('mi')) S.menu = null;
    if (act === 'noop') return render();
    if (act === 'toast') { toast(ds.t); return render(); }
    if (act === 'open-ref') { if (e.target.closest('.cmenu, .menu')) return; return go(ds.href); }
    if (act === 'go-var') { S.variant[ds.ref] = ds.v; return; }
    if (act === 'attn') { S.attnOpen = !S.attnOpen; return render(); }
    if (act === 'as') { S.me = S.me === 'Hadi' ? 'Abdallah' : 'Hadi'; toast(`You are ${S.me} now.`); return render(); }
    if (act === 'new-open') { S.newForm = KIND[route().a] || 'character'; if (route().b) return go(`#/references/${route().a}`); return render(); }
    if (act === 'new-x') { S.newForm = null; return render(); }
    if (act === 'variant') { S.variant[ds.ref] = ds.v; return render(); }
    if (act === 'owner') { ref(ds.ref).owner = ds.n; toast(`${ds.n} owns ${ref(ds.ref).name} now.`); return render(); }
    if (act === 'gen') return startGen(ds.ref, ds.slot, !!ds.fix);
    if (act === 'gen-x') { const g = S.gen; S.gen = null; if (g) { const v = vOf(ref(g.ref), g.v); if (v.status === 'generating') v.status = v.id === 'default' ? 'draft' : 'awaiting'; } return render(); }
    if (act === 'pick') return pick(Number(ds.i));
    if (act === 'approve') { const r = ref(ds.ref), v = vOf(r); v.status = 'approved'; v.version = Math.max(1, v.version); toast(`${r.name}${v.id !== 'default' ? ` · ${v.name}` : ''} is approved. Shots use it now.`); return render(); }
    if (act === 'give-face') { ref(ds.ref).voiceOnly = false; return render(); }
    if (act === 'add') { S.adding = ds.what; return render(); }
    if (act === 'save-version') {
      const r = ref(ds.ref), v = base(r); const was = v.version; v.version++; S.dirty[r.id] = false; delete S.orig[r.id];
      v.usedIn.forEach((n) => { S.stale[n] = { ref: r.id, was }; });
      toast(`Saved as v${v.version}. v${was} is kept; ${plural(v.usedIn.length, 'shot')} marked Stale.`); return render();
    }
    if (act === 'undo-edit') { const r = ref(ds.ref); if (S.orig[r.id]) r.fields = S.orig[r.id]; delete S.orig[r.id]; S.dirty[ds.ref] = false; toast('Back as it was.'); return render(); }
    if (act === 'play') return playVoice(ds.id);
    if (act === 'wave') { const box = b.getBoundingClientRect(); return playVoice(ds.id, (e.clientX - box.left) / box.width); }
    if (act === 'remake') {
      const id = ds.id;
      if (!MEDIA.voice[id]) { toast('In the app this makes a first sample with the voice model.'); return render(); }
      if (S.playing === id) { audio.pause(); S.playing = null; }
      S.remaking[id] = true; render();
      setTimeout(() => { S.remaking[id] = false; S.voiceDirty[id] = false; toast(`New sample for ${ref(id).name}, from the description as it is now.`); render(); }, 1400);
      return;
    }
    if (act === 'clip') {
      const vd = app.querySelector(`video[data-clip="${ds.id}"]`); if (!vd) return;
      if (vd.paused) vd.play(); else vd.pause();
      S.clipPaused[ds.id] = vd.paused;
      vd.closest('.clip').classList.toggle('paused', vd.paused);
      b.innerHTML = ic(vd.paused ? 'play' : 'pause', 'fill');
      return;
    }
    if (act === 'clip-redo') { const id = ds.id; S.clipMaking = id; render(); setTimeout(() => { S.clipMaking = null; S.motionDirty[id] = false; toast('New clip, from the front and the text as it is now.'); render(); }, 1600); return; }
    if (act === 'stale') { delete S.stale[ds.n]; toast(`${ds.n}: ${ds.how}`); return render(); }
  });
  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches('[data-motion]')) { const r = ref(t.dataset.motion); r.motion = t.textContent; if (MEDIA.motion[r.id]) { S.motionDirty[r.id] = true; app.querySelector(`[data-mdirty="${r.id}"]`)?.classList.add('on'); } return; }
    if (t.matches('.val[data-ref]')) {
      const r = ref(t.dataset.ref), k = t.dataset.field, list = t.dataset.list;
      if (list !== 'voice' && base(r).status === 'approved' && !S.orig[r.id]) S.orig[r.id] = JSON.parse(JSON.stringify(r.fields)); // what Undo goes back to
      if (list === 'voice') { const i = Number(k.slice(1)); r.voice[i][1] = t.textContent; r.voiceAi = false; if (MEDIA.voice[r.id]) { S.voiceDirty[r.id] = true; app.querySelector(`[data-vdirty="${r.id}"]`)?.classList.add('on'); } }
      else { const f = r.fields.find((x) => x[0] === k); if (f) f[2] = t.textContent; r.ai = r.ai.filter((x) => x !== k); }
      t.closest('.fld')?.querySelector('[data-aitag]')?.remove(); // edited by a person: no longer a suggestion
      if (base(r).status === 'approved' && list !== 'voice') { S.dirty[r.id] = true; app.querySelector(`[data-dirty="${r.id}"]`)?.classList.add('on'); }
    }
  });
  app.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === 'new') {
      const name = f.querySelector('[data-newname]').value.trim(); if (!name) return;
      const kind = S.newForm, id = `n${Date.now().toString(36)}`;
      const fields = kind === 'character' ? [['age', 'Age', ''], ['build', 'Build', ''], ['face', 'Face', ''], ['hair', 'Hair', ''], ['marks', 'Marks', '']] : kind === 'prop' ? [['what', 'What it is', ''], ['material', 'Material', ''], ['color', 'Colour', ''], ['details', 'Details', '']] : [['what', 'What it is', ''], ['mood', 'Mood', ''], ['era', 'Era', ''], ['details', 'Key details', '']];
      S.refs.push({ id, kind, name, line: 'New', owner: S.me, source: `Added by ${S.me}`, looks: kind === 'character' ? ['short', 'swept', 'bun', 'long'] : [0, 1, 2, 3], fields, ai: [], place: 'fish', heading: `INT. ${name.toUpperCase()} – (from the script)`, areas: [], elements: [], textures: [], lights: [], regulars: [], states: [], expressions: [['neutral'], ['happy'], ['angry'], ['sad'], ['scared'], ['surprised']], exprDone: false, outfits: [], motion: '', voice: [['Age / gender feel', ''], ['Pitch / tone', ''], ['Accent', ''], ['Pace / rhythm', ''], ['Emotional range', ''], ['Sample line', '']], variants: [{ id: 'default', name: 'Default', range: '', status: 'draft', version: 0, sheet: {}, usedIn: [] }] });
      S.newForm = null;
      return go(`#/references/${PLURAL[kind]}/${id}`);
    }
    if (f.dataset.form === 'fix') {
      const txt = f.querySelector('[data-fix]').value.trim(); if (!txt || !S.gen) return;
      S.gen.phase = 'working'; S.gen.fixText = txt; render();
      setTimeout(() => { if (S.gen) { S.gen.phase = 'options'; render(); } }, 1200);
    }
  });
  app.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t.dataset.add !== undefined) {
      if (e.key === 'Escape') { S.adding = null; return render(); }
      if (e.key !== 'Enter') return;
      const name = t.value.trim(); if (!name) return;
      const r = ref(route().b), what = t.dataset.add;
      if (what === 'expr') r.expressions.push([name.toLowerCase(), S.me]);
      if (what === 'outfit') r.outfits.push({ id: `o${Date.now()}`, name, note: '', tone: 'fg2', done: true });
      if (what === 'state') r.states.push({ id: 'open', name, done: true });
      if (what === 'area') r.areas.push({ id: `a${Date.now()}`, name, crop: [80, 40, 160, 90], done: true });
      if (what === 'element') r.elements.push({ id: `e${Date.now()}`, name, note: '', crop: [60, 30, 160, 90], done: true });
      if (what === 'texture') r.textures.push({ name, where: '', kind: ['plaster', 'concrete', 'stone', 'formica'][r.textures.length % 4], done: true });
      if (what === 'light') r.lights.push({ name, kind: 'bulb', color: '#ffd38a', quality: 'Warm or cold, hard or soft, from where', note: '', at: [[160, 60]], r: 60, done: true });
      S.adding = null; toast(`${name} added. Its image is made from the ${r.kind === 'location' ? 'layout' : 'front'}.`); render();
    }
    if (e.key === 'Escape' && S.gen) { S.gen = null; render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.menu) { S.menu = null; render(); } });

  render();
})();
</script>
</body>
</html>
