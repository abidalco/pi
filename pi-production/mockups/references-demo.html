<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>π References Demo</title>
<style>
/* Demo of the References section inside π production. Same tokens and pieces as public/style.css; nothing here is wired to the app. */
:root {
  --bg: #f5f5f3; --surface: #ffffff; --ink: #121214; --t2: #6b6b70; --t3: #a3a3a8;
  --hair: #e7e7e4; --hair-2: #cfcfcb; --hover: #f1f1ef;
  --tint: #1b36a8; --tint-soft: #e9edf9; --danger: #b3261e; --danger-soft: #fdecea;
  --ok: #1f7a4d; --warn: #b07800; --pie-off: #e9e9e6;
  --ph: #ecebe7;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
#app { min-height: 100vh; display: flex; flex-direction: column; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin: 0; }
a { color: inherit; text-decoration: none; }
b { font-weight: 600; }
.muted { color: var(--t2); } .faint { color: var(--t3); } .small { font-size: 13px; } .grow { flex: 1; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; flex: none; }
.ic.s { width: 15px; height: 15px; vertical-align: -3px; }
.ic.l { width: 22px; height: 22px; }

button { font: inherit; font-size: 14px; color: inherit; background: var(--surface); border: 1px solid var(--hair-2); border-radius: 10px; padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
button:hover { border-color: var(--ink); }
button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
button.ghost { background: transparent; border-color: transparent; color: var(--t2); }
button.ghost:hover { color: var(--ink); background: var(--hover); }
button.small { font-size: 13px; padding: 5px 11px; }
.icon { width: 34px; height: 34px; padding: 0; justify-content: center; border-radius: 50%; border: 0; background: transparent; color: var(--t2); }
.icon:hover, .icon.on { background: var(--hover); color: var(--ink); }
input { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--hair-2); border-radius: 10px; padding: 9px 12px; width: 100%; }
input:focus { outline: none; border-color: var(--ink); }
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13.5px; z-index: 80; max-width: 90vw; }
.democap { position: fixed; left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; color: var(--t3); z-index: 5; pointer-events: none; }

/* the header: row 1 = π · project · the four sections · people ⋯ ; row 2 = the section's own tabs */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--surface); }
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
.tl, .tr { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tr { justify-content: flex-end; }
.logo { font-size: 21px; font-weight: 500; width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 10px; flex: none; }
.logo:hover { background: var(--hover); }
.pill { border-radius: 999px; padding: 4px 10px 4px 6px; gap: 8px; border-color: var(--hair); font-size: 14px; }
.pill .pn { font-weight: 600; white-space: nowrap; }
.pill .chev { width: 14px; height: 14px; color: var(--t3); }
.tabs { display: flex; align-items: stretch; height: 56px; gap: 2px; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 0 13px; font-size: 14px; color: var(--t2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.tab.on .ic { color: var(--tint); }
.sub { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; height: 50px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
.sub .sl, .sub .sr { display: flex; align-items: center; gap: 6px; min-width: 0; }
.sub .sr { justify-content: flex-end; }
.segs { display: flex; gap: 2px; background: var(--hover); padding: 3px; border-radius: 10px; }
.seg { padding: 5px 14px; border-radius: 8px; font-size: 13px; color: var(--t2); white-space: nowrap; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg:hover { color: var(--ink); border: 0; }
.seg.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.seg.dim { opacity: .45; cursor: default; }
.seg .n { color: var(--t3); font-weight: 400; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 999px; background: var(--tint); color: #fff; font-size: 10.5px; line-height: 16px; text-align: center; font-weight: 600; }
.people { display: flex; margin: 0 4px; }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--hover); color: var(--t2); display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; border: 2px solid var(--surface); margin-left: -7px; }
.av:first-child { margin-left: 0; }
.av.me { background: var(--ink); color: #fff; }
.mini { width: 20px; height: 20px; border-radius: 50%; background: var(--hover); color: var(--t2); display: inline-grid; place-items: center; font-size: 10px; font-weight: 600; flex: none; }
.mini.me { background: var(--ink); color: #fff; }

.menuwrap { position: relative; display: inline-flex; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; min-width: 240px; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; box-shadow: 0 12px 36px rgba(0,0,0,.09), 0 2px 6px rgba(0,0,0,.04); padding: 6px; display: flex; flex-direction: column; }
.menu.right { left: auto; right: 0; }
.mi { white-space: nowrap; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 9px; font-size: 14px; width: 100%; justify-content: flex-start; display: flex; gap: 10px; align-items: center; color: var(--ink); }
.mi:hover { background: var(--hover); border: 0; }
.mi .ic { color: var(--t2); }
.mi.cur { font-weight: 600; } .mi.cur .ic { color: var(--tint); }
.mi .msub { color: var(--t3); font-weight: 400; font-size: 12.5px; margin-left: auto; padding-left: 12px; white-space: nowrap; }
.mi.danger, .mi.danger .ic { color: var(--danger); }
.mlabel { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--t3); font-weight: 600; padding: 8px 10px 4px; }
.msep { height: 1px; background: var(--hair); margin: 6px 4px; }
.pie { display: block; flex: none; }

/* status: a dot and a word */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--t2); white-space: nowrap; }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--t3); display: inline-block; }
.st.s-ok i { background: var(--ok); } .st.s-review i { background: var(--tint); } .st.s-await i { background: var(--warn); }
.st.s-gen i { background: var(--tint); animation: blink 1s ease-in-out infinite; } .st.s-stale i { background: var(--warn); } .st.s-stale { color: var(--warn); }
.st.s-off i { background: transparent; border: 1.5px solid var(--t3); }
@keyframes blink { 50% { opacity: .25; } }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--hover); color: var(--t2); white-space: nowrap; }
.tag.ai { background: var(--tint-soft); color: var(--tint); }

/* the page */
.page { max-width: 1120px; width: 100%; margin: 0 auto; padding: 22px 24px 120px; }
.attn { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 6px 10px; margin: 0 -10px 14px; font-size: 13px; color: var(--t2); border-radius: 10px; text-align: left; }
.attn:hover { background: var(--hover); border: 0; }
.attn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tint); flex: none; }
.attn .chev { width: 13px; height: 13px; color: var(--t3); }
.attnlist { margin: -8px 0 18px; border: 1px solid var(--hair); border-radius: 14px; background: var(--surface); }
.attnlist a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--hair); font-size: 14px; }
.attnlist a:first-child { border-top: 0; }
.attnlist a:hover { background: var(--hover); }
.attnlist .why { color: var(--t2); font-size: 13px; margin-left: auto; text-align: right; }

/* the gallery */
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 18px; }
.rgrid.wide { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.rc { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
.rc:hover { border-color: var(--hair-2); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,.05); }
.rc .frame { aspect-ratio: 3/4; position: relative; background: var(--ph); border-radius: 15px 15px 0 0; overflow: hidden; }
.rc:has(.menu) { z-index: 10; }
.rc .cardmw { display: contents; }
.rc .cardmw .menu { top: 46px; left: 8px; right: 8px; min-width: 0; }
.rgrid.props .rc .frame { aspect-ratio: 1/1; }
.rgrid.wide .rc .frame { aspect-ratio: 16/10; }
.rc .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
.rc .nm { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.rc .ln { font-size: 12.5px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.rc .cmenu { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .12s; }
.rc:hover .cmenu, .rc .cmenu.open { opacity: 1; }
.rc .cmenu .icon { background: rgba(255,255,255,.92); }
.rc.off .frame { opacity: .55; }
.rc.new { align-items: center; justify-content: center; gap: 10px; color: var(--t2); background: transparent; border-style: dashed; min-height: 200px; }
.rc.new:hover { color: var(--ink); transform: none; box-shadow: none; }
.rc.new .plus { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--hair-2); display: grid; place-items: center; }
.rc.newform { padding: 16px; justify-content: center; gap: 10px; cursor: default; }
.rc.newform:hover { transform: none; box-shadow: none; }
.rc.newform .acts { display: flex; gap: 6px; }
.frame .art, .slot .art, .opt .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.frame .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--t3); }
.frame .ph .ic { width: 30px; height: 30px; stroke-width: 1.3; }
.frame .vo { position: absolute; left: 10px; bottom: 10px; }

/* art: quiet placeholders, drawn in code */
.art .bg { fill: var(--ph); } .art .bg1 { fill: #e9e8e3; } .art .bg2 { fill: #efeeea; } .art .bg3 { fill: #e6e6e2; }
.art .sk { fill: #d3d0c8; } .art .h { fill: #3b3b40; } .art .h2 { fill: #8d8a84; }
.art .fg { fill: color-mix(in srgb, var(--tint) 30%, #3b3b40); } .art .fg2 { fill: #a9a7a1; } .art .pants { fill: #5a5a60; }
.art .ln { stroke: #4a4a50; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.art .ln2 { stroke: #f1efe9; stroke-width: 1.4; fill: none; stroke-linecap: round; }
.art .dk { fill: #3b3b40; } .art .m { fill: #c9c7c0; } .art .m2 { fill: #b9b7b0; } .art .far { fill: #dddcd6; }
.art .fl { fill: #d6d4cd; } .art .wall { fill: #e1dfd9; } .art .wall2 { fill: #d9d7d0; } .art .win { fill: #f6f5f1; stroke: #9a988f; stroke-width: 1.5; }
.art .lamp { fill: #f3e6bf; } .art .plaster { fill: #f0e3cf; stroke: #b9a98e; stroke-width: .8; }
.art .pp { fill: #c8ab7f; stroke: #8f7650; stroke-width: 1.2; } .art .wax { fill: #9b2f2a; }
.art .cv { fill: #8e8a76; } .art .cv2 { fill: #7c7864; } .art .tape { fill: #efe8c8; } .art .tt { font: 600 5px var(--font); fill: #4a4a50; letter-spacing: .02em; }
.art .strip { stroke: #e9eef9; stroke-width: 3; }
.art .aw { fill: color-mix(in srgb, var(--tint) 22%, #cfcdc6); } .art .aw2 { fill: #e9e7e1; }
.art .hint { fill: none; stroke: #9a988f; stroke-width: 1; stroke-dasharray: 3 3; }

/* a reference's room */
.backl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--t2); margin-bottom: 10px; }
.backl:hover { color: var(--ink); }
.rhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rhead .rsub { width: 100%; font-size: 14px; color: var(--t2); margin-top: -4px; }
.varpill { border-radius: 999px; padding: 4px 10px 4px 12px; font-size: 13px; border-color: var(--hair); }
.varpill .chev { width: 13px; height: 13px; color: var(--t3); }
.varpill.alt { border-color: var(--tint); color: var(--tint); background: var(--tint-soft); }
.owner { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--t2); border-radius: 999px; padding: 4px 10px 4px 5px; border-color: var(--hair); }
.waits { font-size: 13px; color: var(--t2); }
.inroom { margin-top: 18px; width: max-content; max-width: 100%; overflow-x: auto; }
.rbody { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; margin-top: 20px; align-items: start; }
.sheet { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.sheet .slot.big { grid-row: span 2; }
.sheet.props { grid-template-columns: 2fr 1fr 1fr; }
.sheet.props .slot.big { grid-row: span 2; }
.slot { position: relative; border-radius: 12px; overflow: hidden; background: var(--ph); aspect-ratio: 3/4; }
.sheet.props .slot { aspect-ratio: 1/1; }
.slot.wide { aspect-ratio: 16/9; }
.slot .slab { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.9); color: var(--t2); padding: 1px 8px; border-radius: 999px; }
.slot .sacts { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; justify-content: flex-end; opacity: 0; transition: opacity .12s; }
.slot:hover .sacts { opacity: 1; }
.slot .sacts button { background: rgba(255,255,255,.95); border-color: transparent; font-size: 12.5px; padding: 4px 10px; }
.slot .sacts button:hover { border-color: var(--ink); }
.slot.empty { background: transparent; border: 1px dashed var(--hair-2); display: grid; place-items: center; text-align: center; }
.slot.empty .in { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; font-size: 12.5px; color: var(--t3); }
.slot.working { background: linear-gradient(100deg, var(--ph) 30%, #f8f8f6 50%, var(--ph) 70%); background-size: 220% 100%; animation: shimmer 1.1s linear infinite; }
.slot.working .in, .opt.working .in { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; color: var(--t2); }
@keyframes shimmer { to { background-position: -220% 0; } }
.flds { display: flex; flex-direction: column; }
.fld { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.fld:first-child { padding-top: 2px; }
.fld .lb { font-size: 12.5px; color: var(--t2); padding-top: 2px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.val { outline: none; border-radius: 6px; padding: 2px 6px; margin: -2px -6px; min-height: 26px; }
.val:hover { background: var(--hover); }
.val:focus { background: var(--surface); box-shadow: 0 0 0 1px var(--ink); }
.val:empty::before { content: attr(data-ph); color: var(--t3); }
.prose { font-size: 15px; line-height: 1.6; max-width: 640px; }
.srcline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t2); margin-top: 16px; }
.dirty { display: none; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #fbf6ea; font-size: 13px; color: #6b5310; }
.dirty.on { display: flex; }
.usedin { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--t2); }
.usedin .sn { font-variant-numeric: tabular-nums; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface); color: var(--ink); font-size: 12.5px; }
.usedin a.sn:hover { border-color: var(--ink); }
.usedin .vlink { margin-left: auto; color: var(--t2); display: inline-flex; gap: 6px; align-items: center; border: 0; background: transparent; padding: 0; font-size: 13px; }
.usedin .vlink:hover { color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin-top: 20px; }
.tiles.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tile .slot { aspect-ratio: 1/1; }
.tiles.outfits .tile .slot { aspect-ratio: 3/4; }
.tiles.wide .tile .slot { aspect-ratio: 16/9; }
.tile .tn { font-size: 13.5px; font-weight: 600; margin-top: 8px; display: flex; gap: 6px; align-items: center; }
.tile .td { font-size: 12.5px; color: var(--t2); line-height: 1.4; }
.tile.add .slot { background: transparent; border: 1px dashed var(--hair-2); display: grid; place-items: center; cursor: pointer; color: var(--t2); }
.tile.add .slot:hover { color: var(--ink); border-color: var(--ink); }
.tile.add input { margin-top: 8px; font-size: 13px; padding: 6px 10px; }
.voiceonly { border: 1px dashed var(--hair-2); border-radius: 16px; padding: 34px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--t2); }
.voiceonly .ic { width: 34px; height: 34px; color: var(--t3); stroke-width: 1.3; }
.regs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.reg { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 3px 12px 3px 3px; border: 1px solid var(--hair); border-radius: 999px; background: var(--surface); }
.reg .face { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; position: relative; background: var(--ph); }
.reg .face svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.script-h { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--hover); padding: 2px 8px; border-radius: 6px; color: var(--ink); }

/* Generate: a panel that only appears when asked */
.gen { position: fixed; top: calc(122px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 380px; z-index: 30; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.05); }
.gen .gh { display: flex; align-items: flex-start; gap: 10px; padding: 14px 12px 10px 16px; border-bottom: 1px solid var(--hair); }
.gen .gh .gt { font-weight: 600; }
.gen .gh .gs { font-size: 12.5px; color: var(--t2); margin-top: 2px; }
.gen .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; overflow-y: auto; align-content: start; }
.gen.wideopts .opts { grid-template-columns: 1fr; }
.opt { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--ph); border: 0; padding: 0; cursor: pointer; display: block; }
.gen.sq .opt { aspect-ratio: 1/1; }
.gen.wideopts .opt { aspect-ratio: 16/9; }
.opt::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .12s; }
.opt:hover::after { box-shadow: inset 0 0 0 2px var(--ink); }
.opt .use { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 12.5px; background: var(--ink); color: #fff; padding: 4px 12px; border-radius: 999px; opacity: 0; transition: opacity .12s; white-space: nowrap; }
.opt:hover .use { opacity: 1; }
.opt.working { cursor: default; background: linear-gradient(100deg, var(--ph) 30%, #f8f8f6 50%, var(--ph) 70%); background-size: 220% 100%; animation: shimmer 1.1s linear infinite; }
.opt.working::after { display: none; }
.gen .gfrom { padding: 0 16px 12px; font-size: 12.5px; color: var(--t2); line-height: 1.45; }
.gen .gfrom b { color: var(--ink); font-weight: 600; }
.gen .gf { margin-top: auto; padding: 12px; border-top: 1px solid var(--hair); display: flex; gap: 8px; }
.gen .gf input { font-size: 13.5px; padding: 8px 12px; }

/* Production glimpse */
.scn { margin-bottom: 30px; }
.scn h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
.shot { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 16px; padding: 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; margin-bottom: 10px; }
.shot .kf { aspect-ratio: 16/9; border-radius: 10px; border: 1px dashed var(--hair-2); display: grid; place-items: center; font-size: 12px; color: var(--t3); text-align: center; padding: 6px; }
.shot .sh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.shot .num { font-weight: 600; font-variant-numeric: tabular-nums; }
.shot .fr { font-size: 12px; color: var(--t2); border: 1px solid var(--hair); border-radius: 6px; padding: 0 6px; }
.shot .act { font-size: 14px; margin-top: 4px; }
.rchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.rchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px 3px 4px; border: 1px solid var(--hair); border-radius: 999px; background: var(--surface); color: var(--ink); }
.rchip:hover { border-color: var(--ink); }
.rchip .th { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; position: relative; background: var(--ph); flex: none; }
.rchip .th svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rchip .th.sq { border-radius: 5px; }
.rchip .q { color: var(--t2); }
.rchip.warn { border-color: #ead9a8; background: #fbf6ea; }
.rchip.addp { color: var(--t2); border-style: dashed; padding: 3px 10px; cursor: pointer; }
.staleline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: #6b5310; background: #fbf6ea; border-radius: 10px; padding: 7px 10px; }
a.btn { font-size: 13px; padding: 5px 11px; border: 1px solid var(--hair-2); border-radius: 10px; display: inline-flex; align-items: center; gap: 7px; background: var(--surface); color: var(--ink); white-space: nowrap; }
a.btn:hover { border-color: var(--ink); }
.ic.fill { fill: currentColor; stroke: none; }

/* sound: a sample you can play */
.player { display: flex; align-items: center; gap: 12px; min-width: 0; }
.play { width: 38px; height: 38px; border-radius: 50%; padding: 0; justify-content: center; background: var(--ink); color: #fff; border-color: var(--ink); flex: none; }
.play:hover { background: #000; }
.play .ic { width: 14px; height: 14px; }
.wave { flex: 1; height: 34px; display: flex; align-items: center; gap: 2px; cursor: pointer; min-width: 0; overflow: hidden; }
.wave i { flex: 1 1 0; min-width: 1px; border-radius: 2px; background: var(--hair-2); }
.wave i.past { background: var(--tint); }
.player.busy .wave i { animation: blink 1s ease-in-out infinite; }
.ptime { font-size: 12px; color: var(--t2); font-variant-numeric: tabular-nums; width: 32px; text-align: right; flex: none; }
.sample { border: 1px solid var(--hair); background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sample .sline { font-size: 14px; color: var(--ink); }
.sample .smeta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--t2); }
.sample .dirty { margin-top: 0; }
.vrow { display: grid; grid-template-columns: 44px minmax(150px, 230px) minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; margin-bottom: 10px; }
.vrow.hl { border-color: var(--tint); box-shadow: 0 0 0 3px var(--tint-soft); }
.vrow .vf { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; position: relative; background: var(--ph); display: grid; place-items: center; color: var(--t3); }
.vrow .vf svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.vrow .vn { display: flex; flex-direction: column; min-width: 0; }
.vrow .vn span { font-size: 12.5px; color: var(--t2); line-height: 1.4; }
.vrow .vacts { display: flex; gap: 6px; align-items: center; }
.secth { font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }

/* motion: a clip that loops like a gif */
.clip { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--ph); }
.clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.clip .slab { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.9); color: var(--t2); padding: 1px 8px; border-radius: 999px; }
.clip .cbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.06); }
.clip .cbar i { display: block; height: 100%; width: 0; background: var(--tint); }
.clip .cplay { position: absolute; left: 8px; bottom: 10px; width: 32px; height: 32px; border-radius: 50%; padding: 0; justify-content: center; background: rgba(255,255,255,.95); border-color: transparent; opacity: 0; transition: opacity .12s; }
.clip .cplay .ic { width: 12px; height: 12px; }
.clip:hover .cplay, .clip.paused .cplay { opacity: 1; }
.clip .sacts { position: absolute; right: 8px; bottom: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity .12s; }
.clip:hover .sacts { opacity: 1; }
.clip .sacts button { background: rgba(255,255,255,.95); border-color: transparent; font-size: 12.5px; padding: 4px 10px; }
.clip .sacts button:hover { border-color: var(--ink); }
.clip.empty { background: transparent; border: 1px dashed var(--hair-2); }
.clip .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: var(--t3); }
.clip.working { background: linear-gradient(100deg, var(--ph) 30%, #f8f8f6 50%, var(--ph) 70%); background-size: 220% 100%; animation: shimmer 1.1s linear infinite; }
.clip.working .in { color: var(--t2); }

/* a location's parts */
.tiles.areas { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.tiles.areas .tile .slot { aspect-ratio: 16/9; }
.tiles.areas .tn { font-size: 12.5px; margin-top: 6px; }
.lrow { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.lrow .lt { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; position: relative; flex: none; background: #1c1d23; }
.lrow .lt.empty { background: transparent; border: 1px dashed var(--hair-2); }
.lrow .lt.working { background: linear-gradient(100deg, var(--ph) 30%, #f8f8f6 50%, var(--ph) 70%); background-size: 220% 100%; animation: shimmer 1.1s linear infinite; }
.lrow .lt svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.lrow .tn { font-size: 13.5px; font-weight: 600; }
.lrow .td { font-size: 12.5px; color: var(--t2); line-height: 1.45; }
@media (max-width: 720px) { .vrow { grid-template-columns: 44px minmax(0, 1fr); } .vrow .player, .vrow .vacts { grid-column: 1 / -1; } .tiles.areas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ghostpage { max-width: 760px; margin: 40px auto; padding: 0 24px; }
.ghostpage .gl { height: 14px; border-radius: 7px; background: #ebebe8; margin: 14px 0; }
.ghostpage p { color: var(--t2); font-size: 14px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 900px) {
  .rbody { grid-template-columns: 1fr; }
  .gen { top: auto; left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; height: 72vh; }
}
@media (max-width: 720px) {
  .top { grid-template-columns: auto 1fr auto; padding: 0 8px; gap: 4px; }
  .pill .pn, .pill .chev { display: none; }
  .pill { padding: 4px; }
  .tabs { justify-content: center; }
  .tab { padding: 0 9px; }
  .tab .tl2 { display: none; }
  .tab.on .tl2 { display: inline; }
  .people { display: none; }
  .sub { grid-template-columns: 1fr auto; padding: 0 8px; }
  .sub .sl { display: none; }
  .sub .segs { overflow-x: auto; }
  .page { padding: 16px 16px 100px; }
  .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .rgrid.wide { grid-template-columns: 1fr; }
  .shot { grid-template-columns: 1fr; }
  .fld { grid-template-columns: 1fr; gap: 4px; }
  .newlbl { display: none; }
}
</style>
</head>
