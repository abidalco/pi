<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#ecebe7}svg{display:block}</style></head>
<body><div id="stage"></div>
<script>
// Omar's motion clip for the References demo: "One step, then he waits." Side view, hands in front, a seamless 4 s loop
// (step, hold, step, hold). Rendered by motion-studio/render.mjs (window.FILM + window.seek).
window.FILM = { width: 640, height: 360, duration: 4, fps: 24 };
const C = { bg: '#ecebe7', ground: '#dddbd4', tick: '#c9c7c0', line: '#4a4a50', skin: '#d3d0c8', hair: '#8d8a84', suit: '#2f2f34', suitFar: '#252529', shirt: '#e6e4de', pants: '#36363b', pantsFar: '#2a2a2e', shoe: '#1f1f22', shadow: '#d2d0c9' };
const GY = 312, L = 58, HX = 320; // ground line, step length, where his hip stays
const ik = (h, f, l1, l2, dir) => {
  const dx = f[0] - h[0], dy = f[1] - h[1], d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01), a = Math.atan2(dy, dx);
  const g = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const k = a - dir * g;
  return [h[0] + l1 * Math.cos(k), h[1] + l1 * Math.sin(k)];
};
const P = (p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`;
const seg = (pts, color, w) => `<path d="M${pts.map(P).join('L')}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const ease = (s) => s * s * (3 - 2 * s);
function leg(hip, foot, color) {
  const knee = ik(hip, foot, 64, 62, 1);
  return seg([hip, knee, foot], color, 19) + `<ellipse cx="${(foot[0] + 7).toFixed(2)}" cy="${(foot[1] + 3).toFixed(2)}" rx="13" ry="5" fill="${C.shoe}"/>`;
}
window.seek = (t) => {
  const tt = t % 4, part = Math.floor(tt), s = tt - part, e = part % 2 === 0 ? ease(s) : 0;
  // feet relative to the hip; the swinging foot lifts, the planted one slides back with the ground
  let near, far, nearLift = 0, farLift = 0, dist;
  if (part === 0) { near = -L / 2 + L * e; far = L / 2 - L * e; nearLift = 15 * Math.sin(Math.PI * e); dist = L * e; }
  else if (part === 1) { near = L / 2; far = -L / 2; dist = L; }
  else if (part === 2) { far = -L / 2 + L * e; near = L / 2 - L * e; farLift = 15 * Math.sin(Math.PI * e); dist = L + L * e; }
  else { near = -L / 2; far = L / 2; dist = 2 * L; }
  const moving = part % 2 === 0;
  const breath = moving ? 0 : Math.sin(Math.PI * s) * 1.4;
  const hy = 184 - (moving ? 3 * Math.sin(Math.PI * e) : 0);
  const hip = [HX, hy];
  const sh = [HX + 6, hy - 76 - breath];
  const swing = moving ? Math.sin(Math.PI * e) * (part === 0 ? -1 : 1) * 5 : 0;
  const handN = [HX + 34 + swing, hy - 18 - breath * 0.5], handF = [HX + 30 - swing, hy - 20 - breath * 0.5];
  const elbowN = ik([sh[0] + 2, sh[1] + 6], handN, 42, 40, -1), elbowF = ik([sh[0] - 2, sh[1] + 4], handF, 42, 40, -1);
  const head = [HX + 12, hy - 107 - breath];
  const sp = L; // ground dashes slide with each step; L divides the loop's 2L
  let ticks = '';
  for (let x = -(dist % sp) - sp; x < 700; x += sp) ticks += `<path d="M${x.toFixed(2)} ${GY + 14}h18" stroke="${C.tick}" stroke-width="3" stroke-linecap="round"/><path d="M${(x + sp / 2).toFixed(2)} ${GY + 32}h28" stroke="${C.tick}" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
  const fy = GY - 8;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
    <rect width="640" height="360" fill="${C.bg}"/>
    <rect y="${GY}" width="640" height="${360 - GY}" fill="${C.ground}"/>${ticks}
    <ellipse cx="${HX + 4}" cy="${GY + 2}" rx="74" ry="5" fill="${C.shadow}"/>
    ${seg([[sh[0] - 2, sh[1] + 4], elbowF, handF], C.suitFar, 14)}<circle cx="${handF[0].toFixed(2)}" cy="${handF[1].toFixed(2)}" r="6" fill="#c4c1b9"/>
    ${leg([HX - 3, hy], [HX + far, fy - farLift], C.pantsFar)}
    ${leg(hip, [HX + near, fy - nearLift], C.pants)}
    ${seg([[HX + 1, hy - 6], sh], C.suit, 46)}
    <path d="M${sh[0] + 10} ${sh[1] - 12}l9 4-4 16z" fill="${C.shirt}"/>
    ${seg([[sh[0] + 4, sh[1] - 14], [head[0] - 2, head[1] + 14]], C.skin, 13)}
    <ellipse cx="${head[0] - 6}" cy="${head[1] - 4}" rx="17" ry="15" fill="${C.hair}"/>
    <ellipse cx="${head[0]}" cy="${head[1]}" rx="16" ry="18.5" fill="${C.skin}"/>
    <path d="M${head[0] - 16} ${head[1] - 2}C${head[0] - 16} ${head[1] - 24} ${head[0] + 12} ${head[1] - 26} ${head[0] + 16} ${head[1] - 9}C${head[0] + 6} ${head[1] - 16} ${head[0] - 6} ${head[1] - 12} ${head[0] - 16} ${head[1] - 2}Z" fill="${C.hair}"/>
    <path d="M${head[0] + 15} ${head[1] - 1}l6 7-6 2z" fill="${C.skin}"/><path d="M${head[0] + 7} ${head[1] - 4}h5" stroke="${C.line}" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M${head[0] + 2} ${head[1] + 9}q6 7 14 3" fill="none" stroke="#a9a59c" stroke-width="5" stroke-linecap="round" opacity=".5"/>
    ${seg([[sh[0] + 2, sh[1] + 6], elbowN, handN], C.suit, 15)}<circle cx="${handN[0].toFixed(2)}" cy="${handN[1].toFixed(2)}" r="6.5" fill="${C.skin}"/>
  </svg>`;
  document.getElementById('stage').innerHTML = svg;
};
seek(0);
</script></body></html>
