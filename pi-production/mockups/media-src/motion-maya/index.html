<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#ecebe7}svg{display:block}</style></head>
<body><div id="stage"></div>
<script>
// Maya's motion clip for the References demo: side view, leaning into the bike, a seamless 2 s loop.
// Rendered by motion-studio/render.mjs (window.FILM + window.seek). Same flat palette as the demo's placeholders.
window.FILM = { width: 640, height: 360, duration: 2, fps: 24 };
const C = { bg: '#ecebe7', ground: '#dddbd4', tick: '#c9c7c0', line: '#4a4a50', skin: '#d3d0c8', hair: '#3b3b40', jacket: '#31395f', strip: '#e9eef9', pants: '#5a5a60', pantsFar: '#45454a', bag: '#8e8a76', bag2: '#7c7864', shoe: '#2a2a2e', shadow: '#d2d0c9' };
const GY = 304, R = 42, D = 2 * Math.PI * R; // ground line, wheel radius, ground covered per loop (one wheel turn)
const rear = [250, GY - R], front = [398, GY - R], bb = [318, GY - R + 3];
const seatTop = [300, 196], headTop = [386, 194], headBot = [392, 212];
const ik = (h, f, l1, l2, dir) => {
  const dx = f[0] - h[0], dy = f[1] - h[1], d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01), a = Math.atan2(dy, dx);
  const g = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const k = a - dir * g;
  return [h[0] + l1 * Math.cos(k), h[1] + l1 * Math.sin(k)];
};
const P = (p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`;
const seg = (pts, color, w) => `<path d="M${pts.map(P).join('L')}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function wheel(c, a) {
  let s = `<circle cx="${c[0]}" cy="${c[1]}" r="${R}" fill="none" stroke="${C.line}" stroke-width="3.2"/><circle cx="${c[0]}" cy="${c[1]}" r="${R - 4}" fill="none" stroke="${C.line}" stroke-width="1" opacity=".4"/>`;
  for (let i = 0; i < 8; i++) { const t = a + (i * Math.PI) / 4; s += `<path d="M${c[0]} ${c[1]}L${(c[0] + (R - 4) * Math.cos(t)).toFixed(2)} ${(c[1] + (R - 4) * Math.sin(t)).toFixed(2)}" stroke="${C.line}" stroke-width=".9" opacity=".6"/>`; }
  return s + `<circle cx="${c[0]}" cy="${c[1]}" r="3" fill="${C.line}"/>`;
}
function leg(hip, pedal, color) {
  const knee = ik(hip, pedal, 57, 56, 1);
  return seg([hip, knee, pedal], color, 15) + `<ellipse cx="${(pedal[0] + 5).toFixed(2)}" cy="${(pedal[1] + 1).toFixed(2)}" rx="10" ry="4.5" fill="${C.shoe}"/>`;
}
window.seek = (t) => {
  const u = (t % 2) / 2, dist = u * D, wa = dist / R, cr = u * 4 * Math.PI; // two crank turns per loop
  const bob = Math.sin(2 * cr) * 1.1;
  const hip = [298, 186 + bob], sh = [360, 134 + bob * 0.6];
  const pedal = (o) => [bb[0] + 20 * Math.cos(cr + o), bb[1] + 20 * Math.sin(cr + o)];
  const pn = pedal(0), pf = pedal(Math.PI);
  // ground: a line and dashes that slide left; the spacing divides one loop so it never jumps
  const sp = D / 3;
  let ticks = '';
  for (let x = -((dist % sp)); x < 700; x += sp) ticks += `<path d="M${x.toFixed(2)} ${GY + 14}h26" stroke="${C.tick}" stroke-width="3" stroke-linecap="round"/><path d="M${(x + sp / 2).toFixed(2)} ${GY + 32}h40" stroke="${C.tick}" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
  // torso and what sits on it
  const dx = sh[0] - hip[0], dy = sh[1] - hip[1], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, nx = uy, ny = -ux; // n = towards her back
  const at = (k, off) => [hip[0] + dx * k + nx * off, hip[1] + dy * k + ny * off];
  const ang = (Math.atan2(dy, dx) * 180) / Math.PI;
  const bagC = at(0.52, 21);
  const hand = [402, 186];
  const elbow = ik(sh, hand, 38, 38, -1);
  const head = [381, 110 + bob * 0.5];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
    <rect width="640" height="360" fill="${C.bg}"/>
    <rect y="${GY}" width="640" height="${360 - GY}" fill="${C.ground}"/>${ticks}
    <ellipse cx="324" cy="${GY + 2}" rx="120" ry="5" fill="${C.shadow}"/>
    ${leg([hip[0] - 2, hip[1]], pf, C.pantsFar)}
    ${seg([bb, pf], C.line, 3)}
    ${wheel(rear, wa)}${wheel(front, wa)}
    ${seg([rear, bb, seatTop, rear], C.line, 4)}${seg([seatTop, headTop], C.line, 4)}${seg([bb, headBot], C.line, 4.4)}${seg([headBot, front], C.line, 3.6)}${seg([headTop, headBot], C.line, 5)}
    ${seg([headTop, [389, 184], [402, 186], [405, 197], [399, 201]], C.line, 3.4)}
    ${seg([[284, 189], [308, 187]], C.line, 5)}${seg([[300, 196], [297, 189]], C.line, 3)}
    <circle cx="${bb[0]}" cy="${bb[1]}" r="9" fill="none" stroke="${C.line}" stroke-width="2.4"/>
    ${seg([hip, sh], C.jacket, 30)}
    ${seg([at(0.58, -14), at(0.58, 14)], C.strip, 3)}
    <g transform="translate(${bagC[0].toFixed(2)} ${bagC[1].toFixed(2)}) rotate(${ang.toFixed(2)})"><rect x="-19" y="-13" width="38" height="26" rx="5" fill="${C.bag}"/><path d="M-19 -6h38" stroke="${C.bag2}" stroke-width="7"/></g>
    ${seg([at(0.88, -9), at(0.5, 16)], C.bag2, 2.6)}
    ${seg([[366, 126 + bob * 0.6], [373, 121 + bob * 0.5]], C.skin, 10)}
    <ellipse cx="${head[0] - 6}" cy="${head[1] - 5}" rx="15.5" ry="13.5" fill="${C.hair}"/>
    <ellipse cx="${head[0]}" cy="${head[1]}" rx="14" ry="16" fill="${C.skin}"/>
    <path d="M${head[0] - 14} ${head[1] - 4}C${head[0] - 14} ${head[1] - 20} ${head[0] + 10} ${head[1] - 24} ${head[0] + 14} ${head[1] - 8}C${head[0] + 6} ${head[1] - 14} ${head[0] - 4} ${head[1] - 12} ${head[0] - 14} ${head[1] - 4}Z" fill="${C.hair}"/>
    <path d="M${head[0] + 13} ${head[1] - 1}l6 6-6 2z" fill="${C.skin}"/><path d="M${head[0] + 6} ${head[1] - 3}h4" stroke="${C.line}" stroke-width="1.6" stroke-linecap="round"/>
    ${seg([sh, elbow, hand], C.jacket, 11)}<circle cx="${hand[0]}" cy="${hand[1]}" r="5" fill="${C.skin}"/>
    ${leg(hip, pn, C.pants)}
    ${seg([bb, pn], C.line, 3.4)}<circle cx="${pn[0].toFixed(2)}" cy="${pn[1].toFixed(2)}" r="2.6" fill="${C.line}"/>
  </svg>`;
  document.getElementById('stage').innerHTML = svg;
};
seek(0);
</script></body></html>
